<style>
/* ── Chat Interno ──────────────────────────────────────────── */
#v-chat-inbox {
  padding: 0;
  height: 78vh;
  min-height: 480px;
  overflow: hidden;
}
.chat-shell {
  display: flex;
  height: 100%;
  overflow: hidden;
}
/* Painel esquerdo — lista de conversas */
.chat-lista-panel {
  width: 280px;
  min-width: 240px;
  border-right: 1px solid var(--bd1);
  display: flex;
  flex-direction: column;
  background: var(--bg-card);
  overflow: hidden;
}
.chat-lista-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--bd1);
  flex-shrink: 0;
}
.chat-lista-hdr-titulo {
  font-size: 13px;
  font-weight: 600;
  color: var(--tx1);
  letter-spacing: 0.01em;
}
.chat-btn-nova {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--bd2);
  background: transparent;
  color: var(--tx2);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s;
}
.chat-btn-nova:hover {
  background: var(--violetbg);
  color: var(--violet);
  border-color: var(--violet);
}
.chat-lista-scroll {
  flex: 1;
  overflow-y: auto;
}
.chat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--bd1);
  transition: background .1s;
  position: relative;
}
.chat-item:hover { background: var(--bg-hover, rgba(0,0,0,.04)); }
.chat-item.ativo { background: var(--violetbg); }
.chat-item-av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--violet);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  text-transform: uppercase;
}
.chat-item-info { flex: 1; min-width: 0; }
.chat-item-nome {
  font-size: 13px;
  font-weight: 600;
  color: var(--tx1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-item-preview {
  font-size: 12px;
  color: var(--tx3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.chat-item-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.chat-item-hora {
  font-size: 11px;
  color: var(--tx4, var(--tx3));
}
.chat-item-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--violet);
}
.chat-item-sem { padding: 24px 16px; font-size: 13px; color: var(--tx3); text-align: center; }
/* Painel direito — thread */
.chat-thread {
  flex: 1;
  min-width: 0;
  position: relative;
  background: var(--bg-base, var(--bg));
  overflow: hidden;
}
#chat-thread-ativo {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
.chat-vazio {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--tx3);
}
.chat-vazio-ic {
  font-size: 40px;
  opacity: .35;
}
.chat-vazio p { font-size: 14px; }
.chat-thread-hdr {
  padding: 12px 18px;
  border-bottom: 1px solid var(--bd1);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  background: var(--bg-card);
}
.chat-thread-hdr-av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--violet);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  text-transform: uppercase;
}
.chat-thread-hdr-nome {
  font-size: 14px;
  font-weight: 600;
  color: var(--tx1);
}
.chat-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.chat-msg {
  display: flex;
  flex-direction: column;
  max-width: 68%;
}
.chat-msg--meu {
  align-items: flex-end;
  align-self: flex-end;
}
.chat-msg--deles {
  align-items: flex-start;
  align-self: flex-start;
}
.chat-msg-autor {
  font-size: 11px;
  color: var(--tx3);
  margin-bottom: 2px;
  padding-left: 2px;
}
.chat-msg-balao {
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--tx1);
  word-break: break-word;
  white-space: pre-wrap;
}
.chat-msg--meu .chat-msg-balao {
  background: var(--violet);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-msg--deles .chat-msg-balao {
  background: var(--bg-card);
  border: 1px solid var(--bd1);
  border-bottom-left-radius: 4px;
}
.chat-msg-hora {
  font-size: 10.5px;
  color: var(--tx4, var(--tx3));
  margin-top: 3px;
  padding: 0 2px;
}
.chat-input-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--bd1);
  background: var(--bg-card);
  flex-shrink: 0;
}
.chat-input {
  flex: 1;
  border: 1px solid var(--bd2);
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 13.5px;
  font-family: inherit;
  background: var(--bg-base, var(--bg));
  color: var(--tx1);
  resize: none;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.45;
  outline: none;
  transition: border-color .15s;
}
.chat-input:focus { border-color: var(--violet); }
.chat-send-btn {
  height: 38px;
  padding: 0 16px;
  background: var(--violet);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity .15s;
}
.chat-send-btn:hover { opacity: .88; }
/* Modal nova conversa */
.chat-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 9000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chat-modal {
  background: var(--bg-card);
  border-radius: 14px;
  padding: 24px;
  width: 360px;
  max-width: 90vw;
  border: 1px solid var(--bd1);
}
.chat-modal h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--tx1);
  margin: 0 0 16px;
}
.chat-modal select {
  width: 100%;
  border: 1px solid var(--bd2);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px;
  background: var(--bg-base, var(--bg));
  color: var(--tx1);
  font-family: inherit;
  margin-bottom: 14px;
  outline: none;
}
.chat-modal select:focus { border-color: var(--violet); }
.chat-modal-btns {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.chat-modal-btns button {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--bd2);
  background: transparent;
  color: var(--tx2);
  transition: background .12s;
}
.chat-modal-btns button.pri {
  background: var(--violet);
  color: #fff;
  border-color: transparent;
}
.chat-modal-btns button:hover { opacity: .85; }
/* Loading/estado vazio */
.chat-loading {
  padding: 20px;
  font-size: 13px;
  color: var(--tx3);
  text-align: center;
}
@media (max-width: 640px) {
  .chat-lista-panel { width: 72px; min-width: 72px; }
  .chat-lista-hdr-titulo, .chat-item-info, .chat-item-meta { display: none; }
  .chat-lista-hdr { justify-content: center; }
  .chat-item { justify-content: center; padding: 10px; }
}
</style>

<div class="view" id="v-chat-inbox">
  <div class="chat-shell">
    <!-- Lista de conversas -->
    <div class="chat-lista-panel">
      <div class="chat-lista-hdr">
        <span class="chat-lista-hdr-titulo">Mensagens</span>
        <button class="chat-btn-nova" onclick="chatNovaConversa()" title="Nova conversa">+</button>
      </div>
      <div class="chat-lista-scroll" id="chat-lista">
        <div class="chat-loading">Carregando...</div>
      </div>
    </div>

    <!-- Thread -->
    <div class="chat-thread" id="chat-thread">
      <div class="chat-vazio" id="chat-vazio">
        <div class="chat-vazio-ic">💬</div>
        <p>Selecione uma conversa</p>
      </div>

      <div id="chat-thread-ativo" style="display:none">
        <div class="chat-thread-hdr" id="chat-thread-hdr">
          <div class="chat-thread-hdr-av" id="chat-hdr-av"></div>
          <span class="chat-thread-hdr-nome" id="chat-hdr-nome"></span>
        </div>
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-input-bar">
          <textarea class="chat-input" id="chat-input" placeholder="Mensagem..." rows="1"
            onkeydown="chatInputKeydown(event)" oninput="chatInputResize(this)"></textarea>
          <button class="chat-send-btn" onclick="chatEnviar()">Enviar</button>
        </div>
      </div>
    </div>
  </div>
</div>

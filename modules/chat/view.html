<style>
/* ── Chat Interno — WhatsApp style ─────────────────────── */
:root {
  --cht-wall:    #111b21;
  --cht-sent:    #005c4b;
  --cht-sent-tx: #e9fcd4;
  --cht-recv:    #202c33;
  --cht-recv-tx: #e9edef;
  --cht-hdr:     #202c33;
  --cht-list:    #111b21;
  --cht-active:  #2a3942;
  --cht-inp:     #2a3942;
}
html[data-theme="light"] {
  --cht-wall:    #efeae2;
  --cht-sent:    #d9fdd3;
  --cht-sent-tx: #111b21;
  --cht-recv:    #ffffff;
  --cht-recv-tx: #111b21;
  --cht-hdr:     #f0f2f5;
  --cht-list:    #ffffff;
  --cht-active:  #f0f2f5;
  --cht-inp:     #f0f2f5;
}

/* Esconde o rodapé e trava o scroll do page quando o chat está ativo —
   evita que o footer empurre o input bar para fora da tela */
body:has(#v-chat-inbox.on) .sipen-footer { display: none; }
body:has(#v-chat-inbox.on) #page { overflow: hidden; }

#v-chat-inbox {
  padding: 0;
  height: 100%;
  overflow: hidden;
}
.chat-shell {
  display: flex;
  height: 100%;
  overflow: hidden;
}

/* ── Painel esquerdo ─────────────────────── */
.chat-lista-panel {
  width: 280px;
  min-width: 220px;
  border-right: 1px solid var(--bd1);
  display: flex;
  flex-direction: column;
  background: var(--cht-list);
  overflow: hidden;
}
.chat-lista-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 14px;
  border-bottom: 1px solid var(--bd1);
  flex-shrink: 0;
}
.chat-lista-hdr-titulo {
  font-size: 18px;
  font-weight: 700;
  color: var(--tx1);
  letter-spacing: -0.02em;
}
.chat-btn-nova {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.07);
  color: var(--tx2);
  cursor: pointer;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.chat-btn-nova:hover { background: rgba(255,255,255,0.13); color: var(--tx1); }
.chat-lista-scroll { flex: 1; overflow-y: auto; }
.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background .1s;
}
html[data-theme="light"] .chat-item { border-bottom-color: rgba(0,0,0,0.06); }
.chat-item:hover { background: rgba(255,255,255,0.04); }
html[data-theme="light"] .chat-item:hover { background: rgba(0,0,0,0.04); }
.chat-item.ativo { background: var(--cht-active); }
.chat-item-av {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--gr);
  color: #fff;
  font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  text-transform: uppercase;
}
.chat-item-info { flex: 1; min-width: 0; }
.chat-item-nome {
  font-size: 14px; font-weight: 600;
  color: var(--tx1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-item-preview {
  font-size: 12.5px; color: var(--tx3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px;
}
.chat-item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.chat-item-hora { font-size: 11px; color: var(--tx4, var(--tx3)); }
.chat-item-dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--gr); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.chat-item-sem { padding: 24px 16px; font-size: 13px; color: var(--tx3); text-align: center; }

/* ── Painel direito ──────────────────────── */
.chat-thread {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--cht-wall);
  overflow: hidden;
  position: relative;
}
.chat-vazio {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--tx3);
}
.chat-vazio-ic { font-size: 48px; opacity: .3; }
.chat-vazio p { font-size: 14px; }

#chat-thread-ativo {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header da conversa */
.chat-thread-hdr {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  background: var(--cht-hdr);
  border-bottom: 1px solid var(--bd1);
  z-index: 1;
}
.chat-thread-hdr-av {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--gr); color: #fff;
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; text-transform: uppercase;
}
.chat-thread-hdr-info { flex: 1; min-width: 0; }
.chat-thread-hdr-nome {
  font-size: 14.5px; font-weight: 600;
  color: var(--tx1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: block;
}
.chat-thread-hdr-sub { font-size: 11px; color: var(--tx3); margin-top: 1px; }

/* Área de mensagens */
.chat-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 12px 8%;
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: var(--cht-wall);
}
.chat-msgs::-webkit-scrollbar { width: 5px; }
.chat-msgs::-webkit-scrollbar-track { background: transparent; }
.chat-msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

/* Grupos de mensagens próximas */
.chat-msg {
  display: flex;
  flex-direction: column;
  max-width: 65%;
  position: relative;
}
.chat-msg--meu  { align-self: flex-end; }
.chat-msg--deles { align-self: flex-start; }

.chat-msg-autor {
  font-size: 11px; color: var(--gr); font-weight: 600;
  margin-bottom: 2px; padding-left: 4px;
}

/* Balão */
.chat-msg-balao {
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  line-height: 1.45;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
  overflow: hidden;
}
.chat-msg--meu .chat-msg-balao {
  background: var(--cht-sent);
  color: var(--cht-sent-tx);
  border-bottom-right-radius: 2px;
}
.chat-msg--deles .chat-msg-balao {
  background: var(--cht-recv);
  color: var(--cht-recv-tx);
  border-bottom-left-radius: 2px;
}

/* Timestamp dentro do balão (float trick) */
.chat-msg-meta {
  font-size: 10px;
  opacity: 0.65;
  white-space: nowrap;
  float: right;
  margin-left: 8px;
  margin-bottom: -2px;
  margin-top: 4px;
  display: inline-block;
}

/* Rabo do balão */
.chat-msg--meu .chat-msg-balao::after {
  content: '';
  position: absolute;
  bottom: 0; right: -7px;
  border-left: 8px solid var(--cht-sent);
  border-top: 7px solid transparent;
}
.chat-msg--deles .chat-msg-balao::after {
  content: '';
  position: absolute;
  bottom: 0; left: -7px;
  border-right: 8px solid var(--cht-recv);
  border-top: 7px solid transparent;
}

/* Preview de anexo pendente */
.chat-anexo-preview {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--cht-hdr);
  border-top: 1px solid var(--bd1);
  flex-shrink: 0;
}
.chat-anexo-preview.ativo { display: flex; }
.chat-anexo-preview-thumb {
  width: 48px; height: 48px; border-radius: 6px;
  object-fit: cover; flex-shrink: 0;
}
.chat-anexo-preview-file {
  width: 48px; height: 48px; border-radius: 6px;
  background: var(--violet); color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; text-transform: uppercase; letter-spacing: .04em;
}
.chat-anexo-preview-nome {
  flex: 1; font-size: 12px; color: var(--tx2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-anexo-preview-rm {
  width: 24px; height: 24px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.1); color: var(--tx2);
  cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.chat-anexo-preview-rm:hover { background: var(--rose); color: #fff; }

/* Barra de input */
.chat-input-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px 12px;
  background: var(--cht-hdr);
  flex-shrink: 0;
  border-top: 1px solid var(--bd1);
}
/* Botão clipe */
.chat-clipe-btn {
  width: 38px; height: 38px; flex-shrink: 0;
  background: transparent; color: var(--tx3); border: none;
  border-radius: 50%; cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: color .15s;
}
.chat-clipe-btn:hover { color: var(--tx1); }

/* Imagem inline no balão */
.chat-msg-img {
  max-width: 220px; max-height: 220px; border-radius: 6px;
  display: block; cursor: pointer; margin-bottom: 4px;
}
/* Arquivo como link */
.chat-msg-file {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px;
  background: rgba(0,0,0,0.15); text-decoration: none;
  margin-bottom: 4px;
}
.chat-msg-file-ic { font-size: 20px; flex-shrink: 0; }
.chat-msg-file-nome { font-size: 12px; color: inherit; word-break: break-all; }
.chat-input-wrap {
  flex: 1;
  background: var(--cht-inp);
  border-radius: 22px;
  display: flex;
  align-items: flex-end;
  padding: 4px 14px;
  border: 1px solid rgba(255,255,255,0.06);
}
html[data-theme="light"] .chat-input-wrap { border-color: rgba(0,0,0,0.08); }
.chat-input {
  flex: 1; border: none; background: transparent;
  color: var(--tx1); font-size: 14px; font-family: inherit;
  resize: none; max-height: 100px; overflow-y: auto;
  line-height: 1.5; outline: none; padding: 5px 0;
  scrollbar-width: none;
}
.chat-input::-webkit-scrollbar { display: none; }
.chat-input::placeholder { color: var(--tx4, var(--tx3)); }
.chat-send-btn {
  width: 42px; height: 42px; flex-shrink: 0;
  background: var(--gr); color: #fff; border: none;
  border-radius: 50%; font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s, transform .12s;
}
.chat-send-btn:hover  { opacity: .88; transform: scale(1.06); }
.chat-send-btn:active { transform: scale(0.93); }

/* Modal */
.chat-modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  z-index: 9000; display: flex; align-items: center; justify-content: center;
}
.chat-modal {
  background: var(--bg-card); border-radius: 14px; padding: 24px;
  width: 360px; max-width: 90vw; border: 1px solid var(--bd1);
}
.chat-modal h3 { font-size: 15px; font-weight: 600; color: var(--tx1); margin: 0 0 16px; }
.chat-modal select {
  width: 100%; border: 1px solid var(--bd2); border-radius: 8px;
  padding: 9px 12px; font-size: 13px; background: var(--bg-base, var(--bg));
  color: var(--tx1); font-family: inherit; margin-bottom: 14px; outline: none;
}
.chat-modal select:focus { border-color: var(--violet); }
.chat-modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
.chat-modal-btns button {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--bd2); background: transparent; color: var(--tx2);
}
.chat-modal-btns button.pri { background: var(--violet); color: #fff; border-color: transparent; }
.chat-modal-btns button:hover { opacity: .85; }
.chat-loading { padding: 20px; font-size: 13px; color: var(--tx3); text-align: center; }

@media (max-width: 640px) {
  .chat-lista-panel { width: 64px; min-width: 64px; }
  .chat-lista-hdr-titulo, .chat-item-info, .chat-item-meta { display: none; }
  .chat-lista-hdr { justify-content: center; }
  .chat-item { justify-content: center; padding: 10px; }
}
</style>

<div class="view" id="v-chat-inbox">
  <div class="chat-shell">

    <!-- Lista de conversas -->
    <div class="chat-lista-panel">
      <div class="chat-lista-hdr">
        <span class="chat-lista-hdr-titulo">Mensagens</span>
        <button class="chat-btn-nova" onclick="chatNovaConversa()" title="Nova conversa">+</button>
      </div>
      <div class="chat-lista-scroll" id="chat-lista">
        <div class="chat-loading">Carregando...</div>
      </div>
    </div>

    <!-- Thread -->
    <div class="chat-thread" id="chat-thread">

      <div class="chat-vazio" id="chat-vazio">
        <div class="chat-vazio-ic">💬</div>
        <p>Selecione uma conversa</p>
      </div>

      <div id="chat-thread-ativo" style="display:none">
        <div class="chat-thread-hdr" id="chat-thread-hdr">
          <div class="chat-thread-hdr-av" id="chat-hdr-av"></div>
          <div class="chat-thread-hdr-info">
            <span class="chat-thread-hdr-nome" id="chat-hdr-nome"></span>
            <div class="chat-thread-hdr-sub">online</div>
          </div>
        </div>

        <div class="chat-msgs" id="chat-msgs"></div>

        <!-- Preview do anexo pendente -->
        <div class="chat-anexo-preview" id="chat-anexo-preview">
          <div id="chat-anexo-thumb"></div>
          <span class="chat-anexo-preview-nome" id="chat-anexo-nome"></span>
          <button class="chat-anexo-preview-rm" onclick="chatRemoverAnexo()" title="Remover">✕</button>
        </div>

        <div class="chat-input-bar">
          <input type="file" id="chat-file-input" style="display:none"
            accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip"
            onchange="chatArquivoSelecionado(this)">
          <button class="chat-clipe-btn" onclick="document.getElementById('chat-file-input').click()" title="Anexar arquivo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <div class="chat-input-wrap">
            <textarea class="chat-input" id="chat-input" placeholder="Mensagem..." rows="1"
              onkeydown="chatInputKeydown(event)" oninput="chatInputResize(this)"></textarea>
          </div>
          <button class="chat-send-btn" onclick="chatEnviar()" title="Enviar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

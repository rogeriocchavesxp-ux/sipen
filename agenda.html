<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda — Igreja Presbiteriana da Penha</title>
<style>
:root {
  --gr:    #216F48;
  --gr2:   #2a9e52;
  --gr-bg: rgba(33,111,72,.08);
  --gr-bd: rgba(33,111,72,.2);
  --bg:    #f5f6f8;
  --card:  #ffffff;
  --bd:    #e4e7ed;
  --tx1:   #111318;
  --tx2:   #4a5060;
  --tx3:   #8a909e;
  --today: rgba(33,111,72,.12);
  --sel:   #216F48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx1);min-height:100vh}

/* ── Header ── */
.site-header{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-logo{display:flex;align-items:center;gap:12px}
.hdr-logo svg{flex-shrink:0}
.hdr-info{line-height:1.3}
.hdr-nome{font-size:13px;font-weight:800;color:var(--gr);letter-spacing:.01em}
.hdr-sub{font-size:10px;color:var(--tx3);font-weight:500}
.hdr-link{font-size:12px;color:var(--tx3);text-decoration:none}
.hdr-link:hover{color:var(--gr)}

/* ── Layout ── */
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px}

/* ── Nav de mês ── */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.month-label{font-size:18px;font-weight:800;color:var(--tx1);text-transform:capitalize}
.month-btns{display:flex;gap:6px}
.month-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.month-btn:hover{background:var(--gr-bg);border-color:var(--gr-bd);color:var(--gr)}
.btn-hoje{padding:0 14px;width:auto;font-size:11px;font-weight:700;letter-spacing:.05em}

/* ── Toggle ── */
.view-toggle{display:flex;gap:4px;background:var(--bd);border-radius:8px;padding:3px}
.vtog{padding:5px 12px;border-radius:6px;border:none;background:transparent;font-size:11px;font-weight:600;color:var(--tx3);cursor:pointer;transition:all .12s}
.vtog.active{background:var(--card);color:var(--tx1);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ── Calendário ── */
#view-cal{display:block}
#view-list{display:none}

.cal-grid{background:var(--card);border-radius:12px;border:1px solid var(--bd);overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--gr);color:#fff}
.cal-head-day{text-align:center;padding:8px 4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:88px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px 4px;position:relative;transition:background .1s}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other-month{background:#fafafa}
.cal-cell.other-month .cal-day-num{opacity:.3}
.cal-cell.is-today{background:var(--today)}
.cal-cell.is-today .cal-day-num{background:var(--gr);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800}
.cal-day-num{font-size:11.5px;font-weight:600;color:var(--tx2);margin-bottom:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-ev{font-size:9.5px;font-weight:600;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--gr-bg);color:var(--gr);border-left:2px solid var(--gr);line-height:1.4;transition:opacity .1s}
.cal-ev:hover{opacity:.75}
.cal-ev.mais{background:transparent;color:var(--tx3);font-size:9px;border:none;padding-left:5px;cursor:pointer}
@media(max-width:600px){
  .cal-cell{min-height:60px;padding:4px 2px}
  .cal-ev{display:none}
  .cal-cell.has-ev::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gr);display:block;margin:2px auto 0}
}

/* ── Vista lista ── */
.list-mes-hdr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);padding:20px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.list-mes-hdr:first-child{padding-top:0}
.ev-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:56px 1fr;gap:12px;cursor:pointer;transition:box-shadow .12s,border-color .12s}
.ev-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:var(--gr-bd)}
.ev-date{text-align:center;background:var(--gr-bg);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.ev-date-dia{font-size:20px;font-weight:900;color:var(--gr);line-height:1}
.ev-date-sem{font-size:8.5px;font-weight:700;text-transform:uppercase;color:var(--gr);opacity:.7;letter-spacing:.06em;margin-top:2px}
.ev-info{}
.ev-titulo{font-size:13.5px;font-weight:700;color:var(--tx1);margin-bottom:4px;line-height:1.3}
.ev-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--tx3)}
.ev-meta span{display:flex;align-items:center;gap:3px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--card);border-radius:16px;width:min(480px,100%);max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-hdr{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-titulo{font-size:17px;font-weight:800;color:var(--tx1);line-height:1.3}
.modal-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx3);font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bd)}
.modal-body{padding:16px 20px 24px}
.modal-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:13px;color:var(--tx2)}
.modal-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.modal-tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--gr-bg);color:var(--gr);border:1px solid var(--gr-bd);margin-top:12px}

/* ── Vazio / Loading ── */
.state-center{text-align:center;padding:48px 20px;color:var(--tx3)}
.state-icon{font-size:36px;margin-bottom:12px}
.state-txt{font-size:13px}

/* ── Footer ── */
.site-footer{text-align:center;padding:20px;font-size:11px;color:var(--tx3);border-top:1px solid var(--bd);background:var(--card);margin-top:40px}
</style>
</head>

    <div class="hdr-info">
      <div class="hdr-nome">Igreja Presbiteriana da Penha</div>
      <div class="hdr-sub">Agenda de Atividades</div>
    </div>
  </div>
  <a href="/chamado" class="hdr-link">Solicitar espaço →</a>
</header>

<div class="wrap">

  <!-- Controles -->
  <div class="month-nav">
    <div class="month-btns">
      <button class="month-btn" onclick="navMes(-1)">‹</button>
      <button class="month-btn btn-hoje" onclick="irHoje()">Hoje</button>
      <button class="month-btn" onclick="navMes(1)">›</button>
    </div>
    <span class="month-label" id="mes-label"></span>
    <div class="view-toggle">
      <button class="vtog active" id="btn-cal" onclick="setView('cal')">Calendário</button>
      <button class="vtog" id="btn-list" onclick="setView('list')">Lista</button>
    </div>
  </div>

  <!-- Calendário -->
  <div id="view-cal">
    <div class="cal-grid">
      <div class="cal-head">
        <div class="cal-head-day">Dom</div>
        <div class="cal-head-day">Seg</div>
        <div class="cal-head-day">Ter</div>
        <div class="cal-head-day">Qua</div>
        <div class="cal-head-day">Qui</div>
        <div class="cal-head-day">Sex</div>
        <div class="cal-head-day">Sáb</div>
      </div>
      <div class="cal-body" id="cal-body"></div>
    </div>
  </div>

  <!-- Lista -->
  <div id="view-list"></div>

  <!-- Loading / vazio -->
  <div id="state-loading" class="state-center">
    <div class="state-icon">⏳</div>
    <div class="state-txt">Carregando agenda...</div>
  </div>
  <div id="state-empty" class="state-center" style="display:none">
    <div class="state-icon">📭</div>
    <div class="state-txt">Nenhuma atividade neste mês.</div>
  </div>

</div>

<!-- Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-titulo" id="modal-titulo"></div>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<footer class="site-footer">
  Igreja Presbiteriana da Penha · SIPEN
</footer>

<script>
const SB_URL = "https://erhwryfzpycahgsohhbh.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyaHdyeWZ6cHljYWhnc29oaGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg2MTUsImV4cCI6MjA5MTg0NDYxNX0.T0hp90Bmufj6a3oUPq1vYcLiGx9YjyMaZiE38S0e3_8";
const HDR   = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS  = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

let _todos = [];
let _ano   = new Date().getFullYear();
let _mes   = new Date().getMonth();
let _view  = "cal";

async function carregar() {
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/rpc/agenda_publica`,
      { method: "POST", headers: { ...HDR, "Content-Type": "application/json" }, body: "{}" }
    );
    _todos = res.ok ? await res.json() : [];
  } catch(_) { _todos = []; }
  document.getElementById("state-loading").style.display = "none";
  renderizar();
}

function eventosDomes() {
  return _todos.filter(r => {
    if (!r.data) return false;
    const d = new Date(r.data + "T00:00:00");
    return d.getFullYear() === _ano && d.getMonth() === _mes;
  });
}

function renderizar() {
  document.getElementById("mes-label").textContent = MESES[_mes] + " " + _ano;
  const evs = eventosDomes();
  document.getElementById("state-empty").style.display = evs.length ? "none" : "block";
  if (_view === "cal") renderCal(evs);
  else renderList();
}

function renderCal(evs) {
  const body = document.getElementById("cal-body");
  body.innerHTML = "";
  const hoje = new Date();
  const inicio = new Date(_ano, _mes, 1);
  const fim    = new Date(_ano, _mes + 1, 0);
  const primeiroDia = inicio.getDay();

  const mapaEvs = {};
  evs.forEach(r => {
    const k = r.data.slice(0, 10);
    if (!mapaEvs[k]) mapaEvs[k] = [];
    mapaEvs[k].push(r);
  });

  const totalCells = Math.ceil((primeiroDia + fim.getDate()) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement("div");
    cell.className = "cal-cell";
    const dOffset = i - primeiroDia;
    const d = new Date(_ano, _mes, dOffset + 1);
    const isThisMonth = d.getMonth() === _mes;
    const isToday = d.toDateString() === hoje.toDateString();
    if (!isThisMonth) cell.classList.add("other-month");
    if (isToday) cell.classList.add("is-today");

    const numEl = document.createElement("div");
    numEl.className = "cal-day-num";
    numEl.textContent = d.getDate();
    cell.appendChild(numEl);

    const k = d.toISOString().slice(0, 10);
    const dayEvs = mapaEvs[k] || [];
    if (dayEvs.length) cell.classList.add("has-ev");

    const MAX = 3;
    dayEvs.slice(0, MAX).forEach(ev => {
      const el = document.createElement("div");
      el.className = "cal-ev";
      el.textContent = (ev.hora_inicio ? fmtH(ev.hora_inicio) + " " : "") + ev.titulo;
      el.onclick = () => abrirModal(ev);
      cell.appendChild(el);
    });
    if (dayEvs.length > MAX) {
      const mais = document.createElement("div");
      mais.className = "cal-ev mais";
      mais.textContent = `+${dayEvs.length - MAX} mais`;
      mais.onclick = () => abrirDia(k, dayEvs);
      cell.appendChild(mais);
    }
    body.appendChild(cell);
  }
}

function renderList() {
  const el = document.getElementById("view-list");
  el.innerHTML = "";
  const mesAtual = _mes;
  const anoAtual = _ano;

  const evsMes = _todos.filter(r => {
    if (!r.data) return false;
    const d = new Date(r.data + "T00:00:00");
    return d.getFullYear() === anoAtual && d.getMonth() === mesAtual;
  });

  if (!evsMes.length) { el.innerHTML = ""; return; }

  const hdr = document.createElement("div");
  hdr.className = "list-mes-hdr";
  hdr.textContent = MESES[mesAtual] + " " + anoAtual;
  el.appendChild(hdr);

  evsMes.forEach(ev => {
    const d   = new Date(ev.data + "T00:00:00");
    const dia = String(d.getDate()).padStart(2, "0");
    const sem = DIAS[d.getDay()];
    const card = document.createElement("div");
    card.className = "ev-card";
    card.onclick = () => abrirModal(ev);
    const horario = ev.hora_inicio ? fmtH(ev.hora_inicio) + (ev.hora_fim ? " – " + fmtH(ev.hora_fim) : "") : "";
    card.innerHTML = `
      <div class="ev-date">
        <div class="ev-date-dia">${dia}</div>
        <div class="ev-date-sem">${sem}</div>
      </div>
      <div class="ev-info">
        <div class="ev-titulo">${esc(ev.titulo)}</div>
        <div class="ev-meta">
          ${horario ? `<span>🕐 ${esc(horario)}</span>` : ""}
          ${ev.espaco ? `<span>📍 ${esc(ev.espaco)}</span>` : ""}
          ${ev.organizador ? `<span>👤 ${esc(ev.organizador)}</span>` : ""}
        </div>
      </div>`;
    el.appendChild(card);
  });
}

function abrirModal(ev) {
  const d = ev.data ? new Date(ev.data + "T00:00:00") : null;
  const dataFmt = d ? `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} (${DIAS[d.getDay()]})` : "";
  const horario = ev.hora_inicio ? fmtH(ev.hora_inicio) + (ev.hora_fim ? " – " + fmtH(ev.hora_fim) : "") : "";

  document.getElementById("modal-titulo").textContent = ev.titulo || "Evento";
  document.getElementById("modal-body").innerHTML = `
    ${dataFmt  ? `<div class="modal-row"><span class="modal-icon">📅</span><span>${esc(dataFmt)}</span></div>` : ""}
    ${horario  ? `<div class="modal-row"><span class="modal-icon">🕐</span><span>${esc(horario)}</span></div>` : ""}
    ${ev.espaco ? `<div class="modal-row"><span class="modal-icon">📍</span><span>${esc(ev.espaco)}</span></div>` : ""}
    ${ev.organizador ? `<div class="modal-row"><span class="modal-icon">👤</span><span>${esc(ev.organizador)}</span></div>` : ""}
    ${ev.descricao ? `<div class="modal-row"><span class="modal-icon">📝</span><span style="white-space:pre-wrap">${esc(ev.descricao)}</span></div>` : ""}
    ${ev.recorrencia && ev.recorrencia !== "Único" ? `<span class="modal-tag">🔁 ${esc(ev.recorrencia)}</span>` : ""}
  `;
  document.getElementById("modal").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function abrirDia(data, evs) {
  document.getElementById("modal-titulo").textContent = fmtDataLonga(data);
  document.getElementById("modal-body").innerHTML = evs.map(ev => {
    const horario = ev.hora_inicio ? fmtH(ev.hora_inicio) + (ev.hora_fim ? " – " + fmtH(ev.hora_fim) : "") : "";
    return `<div style="padding:10px 0;border-bottom:1px solid #eee;cursor:pointer" onclick="abrirModal(${JSON.stringify(ev).replace(/"/g,'&quot;')})">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px">${esc(ev.titulo)}</div>
      <div style="font-size:11px;color:#666">${[horario, ev.espaco].filter(Boolean).join(" · ")}</div>
    </div>`;
  }).join("");
  document.getElementById("modal").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function fecharModal(e) {
  if (e && e.target !== document.getElementById("modal")) return;
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "";
}

function navMes(d) {
  _mes += d;
  if (_mes > 11) { _mes = 0; _ano++; }
  if (_mes < 0)  { _mes = 11; _ano--; }
  renderizar();
}

function irHoje() {
  const hoje = new Date();
  _ano = hoje.getFullYear();
  _mes = hoje.getMonth();
  renderizar();
}

function setView(v) {
  _view = v;
  document.getElementById("view-cal").style.display  = v === "cal"  ? "block" : "none";
  document.getElementById("view-list").style.display = v === "list" ? "block" : "none";
  document.getElementById("btn-cal").classList.toggle("active",  v === "cal");
  document.getElementById("btn-list").classList.toggle("active", v === "list");
  renderizar();
}

function fmtH(h) { return h ? String(h).slice(0, 5) : ""; }
function fmtDataLonga(iso) {
  const d = new Date(iso + "T00:00:00");
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} – ${DIAS[d.getDay()]}`;
}
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

carregar();
</script>
</body>
</html>

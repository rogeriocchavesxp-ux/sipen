<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidatos — Eleição de Oficiais 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --verde:    #216F48;
    --verde2:   #2a9e5c;
    --verde3:   #30d158;
    --dark:     #071810;
    --dark2:    #0d2118;
    --dark3:    #132b20;
    --gold:     #c9a84a;
    --gold2:    #e8c96b;
    --white:    #ffffff;
    --w80:      rgba(255,255,255,.80);
    --w50:      rgba(255,255,255,.50);
    --w25:      rgba(255,255,255,.25);
    --w10:      rgba(255,255,255,.10);
    --w06:      rgba(255,255,255,.06);
    --sky:      #4a9cf5;
    --teal:     #2dd4bf;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    color: var(--white);
    font-family: 'Georgia', serif;
    overflow: hidden;
    user-select: none;
  }

  #deck { width: 100%; height: 100%; position: relative; }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateX(50px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
    overflow: hidden;
  }
  .slide.active    { opacity: 1; transform: translateX(0);    pointer-events: all; }
  .slide.exit-left { opacity: 0; transform: translateX(-50px); pointer-events: none; }

  /* ── Capa ───────────────────────────────── */
  .slide-capa {
    background: radial-gradient(ellipse at 50% 35%, #163326 0%, var(--dark) 70%);
    gap: 14px;
    text-align: center;
    padding: 40px 60px;
  }
  .capa-logo { width: 160px; height: auto; margin-bottom: 8px; }
  .capa-sup {
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    font-family: sans-serif; font-weight: 700; color: var(--verde3);
  }
  .capa-titulo { font-size: clamp(30px, 5vw, 58px); font-weight: 700; line-height: 1.15; }
  .capa-titulo em { color: var(--gold2); font-style: normal; }
  .capa-sub { font-size: 15px; color: var(--w50); font-family: sans-serif; }
  .capa-versiculo {
    max-width: 500px; font-size: 13.5px; font-style: italic;
    color: var(--w50); line-height: 1.75; margin-top: 20px;
    border-top: 1px solid var(--w10); padding-top: 18px;
  }
  .capa-versiculo strong { color: var(--w80); font-style: normal; }

  /* ── Divisor ────────────────────────────── */
  .slide-divisor {
    background: radial-gradient(ellipse at 50% 50%, #112a1d 0%, var(--dark) 70%);
    gap: 12px; text-align: center; padding: 60px;
  }
  .div-icon   { font-size: 52px; filter: drop-shadow(0 0 20px currentColor); }
  .div-sup    { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; font-family: sans-serif; font-weight: 700; color: var(--w25); }
  .div-titulo { font-size: clamp(28px, 4vw, 52px); font-weight: 700; }
  .div-count  { font-size: 13px; font-family: sans-serif; color: var(--w50); margin-top: 4px; }

  /* ── Candidato ──────────────────────────── */
  .slide-cand {
    background: linear-gradient(155deg, #0f2419 0%, var(--dark) 100%);
    padding: 40px 56px 48px;
    justify-content: center;
    gap: 20px;
  }

  .slide-cand::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--cand-cor, var(--verde3)), transparent);
    z-index: 2;
  }

  .cand-header {
    display: flex;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 960px;
  }
  .cand-foto {
    width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--w10);
    box-shadow: 0 0 0 5px rgba(33,111,72,.25), 0 8px 28px rgba(0,0,0,.5);
    flex-shrink: 0; display: block;
  }
  .cand-sem-foto {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--dark3); border: 2px solid var(--w10);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; flex-shrink: 0;
  }
  .cand-info { flex: 1; min-width: 0; }
  .cand-badge {
    display: inline-flex; align-items: center;
    font-size: 10px; font-family: sans-serif; font-weight: 800;
    letter-spacing: .15em; text-transform: uppercase;
    padding: 3px 11px; border-radius: 20px; margin-bottom: 8px;
  }
  .cand-nome  { font-size: clamp(22px, 2.8vw, 38px); font-weight: 700; line-height: 1.15; }
  .cand-congr { font-size: 13px; font-family: sans-serif; color: var(--w50); margin-top: 5px; }

  .cand-campos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 960px;
    height: 260px;
  }
  .cand-campo {
    background: var(--w06);
    border: 1px solid var(--w10);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
    overflow: hidden;
  }
  .campo-lbl {
    font-size: 9px; font-family: sans-serif; font-weight: 800;
    letter-spacing: .22em; text-transform: uppercase; color: var(--w25); flex-shrink: 0;
  }
  .campo-val {
    font-size: 13px; line-height: 1.65; color: var(--w80);
    overflow-y: auto; flex: 1;
    scrollbar-width: thin; scrollbar-color: var(--w10) transparent;
  }
  .campo-vazio { color: var(--w25); font-style: italic; font-size: 12.5px; }

  /* ── Slide final ────────────────────────── */
  .slide-fim {
    background: radial-gradient(ellipse at 50% 40%, #163326 0%, var(--dark) 70%);
    gap: 16px; text-align: center; padding: 60px;
  }
  .fim-icon   { font-size: 52px; }
  .fim-titulo { font-size: clamp(24px, 3.5vw, 44px); font-weight: 700; line-height: 1.25; }

  /* ── Nav ────────────────────────────────── */
  #nav-prev, #nav-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--w10); background: var(--w06);
    color: var(--w50); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s, opacity .2s;
    backdrop-filter: blur(8px); z-index: 100;
  }
  #nav-prev { left: 16px; } #nav-next { right: 16px; }
  #nav-prev:hover, #nav-next:hover { background: var(--w10); color: var(--white); }
  .hidden { opacity: 0 !important; pointer-events: none !important; }

  /* ── Dots ───────────────────────────────── */
  #progress {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 100;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--w25); cursor: pointer; transition: background .25s, width .25s; }
  .dot.active { background: var(--verde3); width: 18px; border-radius: 3px; }
  .dot.sec    { background: var(--w10); }

  /* ── HUD ────────────────────────────────── */
  #counter {
    position: fixed; top: 16px; right: 20px;
    font-size: 11px; font-family: sans-serif; color: var(--w25); z-index: 100;
  }
  #autoplay-btn {
    position: fixed; top: 16px; left: 20px;
    font-size: 11px; font-family: sans-serif;
    background: var(--w06); border: 1px solid var(--w10);
    color: var(--w50); padding: 5px 12px; border-radius: 20px;
    cursor: pointer; z-index: 100; transition: background .2s;
  }
  #autoplay-btn:hover { background: var(--w10); color: var(--white); }
  #autoplay-btn.on    { color: var(--verde3); border-color: var(--verde3); }

  /* ── Loading ────────────────────────────── */
  #loading {
    position: fixed; inset: 0; background: var(--dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 999;
  }
  .spin {
    width: 32px; height: 32px;
    border: 3px solid var(--w10); border-top-color: var(--verde3);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-txt { font-family: sans-serif; font-size: 12px; color: var(--w50); }

  /* ── Mobile ────────────────────────────── */
  @media (max-width: 640px) {
    .slide-cand {
      padding: 32px 20px 80px;
      justify-content: flex-start;
      overflow-y: auto;
      gap: 20px;
    }
    /* Header vira coluna: foto centralizada, info abaixo */
    .cand-header {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .cand-foto, .cand-sem-foto {
      width: 100px; height: 100px;
    }
    .cand-sem-foto { font-size: 40px; }
    .cand-nome { font-size: 22px; }
    .cand-congr { font-size: 12px; }
    /* Cards em coluna */
    .cand-campos {
      grid-template-columns: 1fr;
      height: auto;
    }
    .cand-campo { min-height: 0; }
    .campo-val  { max-height: none; overflow-y: visible; }
    /* Setas na base */
    #nav-prev, #nav-next {
      top: auto; bottom: 22px; transform: none;
      width: 44px; height: 44px; font-size: 18px;
    }
    #nav-prev { left: calc(50% - 54px); }
    #nav-next { left: calc(50% + 10px); }
    #progress { bottom: 6px; }
    #autoplay-btn { font-size: 10px; padding: 4px 10px; }
    #wm { display: none; }
  }

  /* ── Watermark ──────────────────────────── */
  #wm {
    position: fixed; bottom: 42px; right: 20px;
    opacity: .15; z-index: 100; pointer-events: none;
  }
  #wm img { height: 26px; filter: brightness(10); }
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div class="load-txt">Carregando candidatos…</div></div>
<div id="deck"></div>
<button id="nav-prev" class="hidden" onclick="slide(-1)">‹</button>
<button id="nav-next" class="hidden" onclick="slide(1)">›</button>
<div id="progress"></div>
<div id="counter"></div>
<button id="autoplay-btn" onclick="toggleAutoplay()">▶ Auto</button>
<div id="wm"><img src="icons/logo-ippenha.svg" alt="IPPenha" onerror="this.style.display='none'"></div>

<script>
const SUPA_URL = "https://erhwryfzpycahgsohhbh.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyaHdyeWZ6cHljYWhnc29oaGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg2MTUsImV4cCI6MjA5MTg0NDYxNX0.T0hp90Bmufj6a3oUPq1vYcLiGx9YjyMaZiE38S0e3_8";
const SLUG = new URLSearchParams(location.search).get("p") || "eleicao-de-oficiais-2026-2026-2";

let slides = [], current = 0, autoTimer = null, autoOn = false;

function esc(s) {
  return s ? String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") : "";
}

async function init() {
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  const { data, error } = await sb.rpc("eleicao_candidatos_publicos", { p_slug: SLUG });
  if (error || !data) {
    document.getElementById("loading").innerHTML =
      `<div style="font-family:sans-serif;color:#e55;font-size:13px;text-align:center">
        Erro ao carregar candidatos.<br>
        <small style="color:rgba(255,255,255,.3)">${esc(error?.message||"Função não encontrada — execute o SQL no Supabase.")}</small>
      </div>`;
    return;
  }
  // Deduplicar por nome, mantendo o registro mais completo (maior pontuação de campos)
  function dedup(arr) {
    const map = new Map();
    arr.forEach(c => {
      const key   = c.nome.trim().toLowerCase();
      const score = (c.foto_url ? 1 : 0)
                  + (c.vida_familiar ? 3 : 0)
                  + (c.vida_eclesiastica ? 3 : 0)
                  + (c.vida_profissional ? 3 : 0);
      const prev = map.get(key);
      if (!prev || score > prev._score) map.set(key, { ...c, _score: score });
    });
    return [...map.values()];
  }
  const presbiteros = dedup(data.filter(c => c.tipo === "presbitero"));
  const diaconos    = dedup(data.filter(c => c.tipo === "diacono"));
  build(presbiteros, diaconos);
  renderSlide();
  document.getElementById("loading").style.display = "none";
  updateNav();
}

function campo(lbl, val) {
  return `<div class="cand-campo">
    <div class="campo-lbl">${lbl}</div>
    ${val
      ? `<div class="campo-val">${esc(val)}</div>`
      : `<div class="campo-val campo-vazio">Não informado</div>`}
  </div>`;
}

function candSlide(idx, c, tipo) {
  const cor   = tipo === "presbitero" ? "var(--sky)" : "var(--teal)";
  const bgCor = tipo === "presbitero" ? "rgba(74,156,245,.12)" : "rgba(45,212,191,.12)";
  const lbl   = tipo === "presbitero" ? "Presbítero" : "Diácono";
  const foto  = c.foto_url
    ? `<img class="cand-foto" src="${esc(c.foto_url)}" alt="${esc(c.nome)}">`
    : `<div class="cand-sem-foto">👤</div>`;
  return `
    <div class="slide slide-cand" id="s-${idx}" style="--cand-cor:${cor}">
      <div class="cand-header">
        ${foto}
        <div class="cand-info">
          <div class="cand-badge" style="background:${bgCor};color:${cor}">${lbl}</div>
          <div class="cand-nome">${esc(c.nome)}</div>
          <div class="cand-congr">${esc(c.congregacao || "Sede")}</div>
        </div>
      </div>
      <div class="cand-campos">
        ${campo("Vida Familiar", c.vida_familiar)}
        ${campo("Vida Eclesiástica", c.vida_eclesiastica)}
        ${campo("Vida Profissional", c.vida_profissional)}
      </div>
    </div>`;
}

function build(presbiteros, diaconos) {
  const deck = document.getElementById("deck");

  // Capa
  slides.push("capa");
  deck.insertAdjacentHTML("beforeend", `
    <div class="slide slide-capa" id="s-0">
      <img class="capa-logo" src="icons/logo-ippenha.svg" alt="IPPenha" onerror="this.style.display='none'">
      <h1 class="capa-titulo">Eleição de<br><em>Oficiais 2026</em></h1>
      <p class="capa-sub">Conheça os candidatos</p>
      <p class="capa-versiculo">
        "Cada um coloque a serviço dos outros o dom que recebeu,
        como bons administradores da multiforme graça de Deus."
        <br><strong>1 Pedro 4:10</strong>
      </p>
    </div>`);

  // Presbíteros
  if (presbiteros.length) {
    const di = slides.length;
    slides.push("div");
    deck.insertAdjacentHTML("beforeend", `
      <div class="slide slide-divisor" id="s-${di}">
        <div class="div-icon" style="color:var(--sky)">⛪</div>
        <div class="div-sup">Candidatos ao</div>
        <h2 class="div-titulo" style="color:var(--sky)">Presbiterato</h2>
        <div class="div-count">${presbiteros.length} candidato${presbiteros.length!==1?"s":""}</div>
      </div>`);
    presbiteros.forEach(c => { const ci = slides.length; slides.push("cand"); deck.insertAdjacentHTML("beforeend", candSlide(ci, c, "presbitero")); });
  }

  // Diáconos
  if (diaconos.length) {
    const di = slides.length;
    slides.push("div");
    deck.insertAdjacentHTML("beforeend", `
      <div class="slide slide-divisor" id="s-${di}">
        <div class="div-icon" style="color:var(--teal)">🤝</div>
        <div class="div-sup">Candidatos ao</div>
        <h2 class="div-titulo" style="color:var(--teal)">Diaconato</h2>
        <div class="div-count">${diaconos.length} candidato${diaconos.length!==1?"s":""}</div>
      </div>`);
    diaconos.forEach(c => { const ci = slides.length; slides.push("cand"); deck.insertAdjacentHTML("beforeend", candSlide(ci, c, "diacono")); });
  }

  // Final
  const fi = slides.length;
  slides.push("fim");
  deck.insertAdjacentHTML("beforeend", `
    <div class="slide slide-fim" id="s-${fi}">
      <div class="fim-icon">🙏</div>
      <h2 class="fim-titulo">Que o Senhor guie<br>nossa escolha</h2>
      <p class="capa-versiculo" style="margin-top:20px">
        "Reconhece-o em todos os teus caminhos,<br>e ele endireitará as tuas veredas."
        <br><strong>Provérbios 3:6</strong>
      </p>
    </div>`);

  // Dots
  document.getElementById("progress").innerHTML = slides.map((t, i) =>
    `<div class="dot${t==="cand"?"":" sec"}" id="dot-${i}" onclick="goTo(${i})"></div>`
  ).join("");
}

function renderSlide() {
  const prev = document.querySelector(".slide.active");
  const next = document.getElementById(`s-${current}`);
  if (prev && prev !== next) {
    prev.classList.remove("active");
    prev.classList.add("exit-left");
    setTimeout(() => prev?.classList.remove("exit-left"), 550);
  }
  next?.classList.add("active");
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === current));
  const before = slides.slice(0, current + 1).filter(t => t === "cand").length;
  const total  = slides.filter(t => t === "cand").length;
  document.getElementById("counter").textContent = slides[current] === "cand" ? `${before} / ${total}` : "";
  updateNav();
}

function updateNav() {
  document.getElementById("nav-prev").classList.toggle("hidden", current === 0);
  document.getElementById("nav-next").classList.toggle("hidden", current === slides.length - 1);
}

function slide(d) {
  const n = current + d;
  if (n < 0 || n >= slides.length) return;
  current = n; renderSlide();
}

function goTo(i) {
  if (i < 0 || i >= slides.length) return;
  current = i; renderSlide();
}

function toggleAutoplay() {
  autoOn = !autoOn;
  const btn = document.getElementById("autoplay-btn");
  btn.classList.toggle("on", autoOn);
  btn.textContent = autoOn ? "⏸ Auto" : "▶ Auto";
  if (autoOn) {
    autoTimer = setInterval(() => {
      if (current < slides.length - 1) { slide(1); }
      else { autoOn = false; clearInterval(autoTimer); btn.classList.remove("on"); btn.textContent = "▶ Auto"; }
    }, 8000);
  } else { clearInterval(autoTimer); }
}

// Swipe touch
let _tx = null;
document.addEventListener("touchstart", e => { _tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => {
  if (_tx === null) return;
  const dx = e.changedTouches[0].clientX - _tx;
  _tx = null;
  if (Math.abs(dx) < 40) return;
  // só navega se o toque não foi num card scrollável
  const target = e.target.closest(".cand-campo");
  if (target) return;
  slide(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("keydown", e => {
  if (e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){ e.preventDefault(); slide(1); }
  if (e.key==="ArrowLeft" ||e.key==="ArrowUp"               ){ e.preventDefault(); slide(-1); }
  if (e.key==="f"||e.key==="F") document.documentElement.requestFullscreen?.();
});

init();
</script>
</body>
</html>

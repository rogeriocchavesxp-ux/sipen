<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campanha — IPPenha</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #ffffff;
    --bg2:   #f5f5f7;
    --bd:    #e5e7eb;
    --tx1:   #111827;
    --tx2:   #374151;
    --tx3:   #9ca3af;
    --gr:    #16a34a;
    --violet:#7c3aed;
    --gold:  #d97706;
    --rose:  #dc2626;
    --blue:  #2563eb;
    --radius:12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:  #111318;
      --bg2: #1a1d21;
      --bd:  #2d3139;
      --tx1: #f0f2f5;
      --tx2: #b0b8c8;
      --tx3: #606878;
    }
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg2);
    color: var(--tx1);
    min-height: 100dvh;
    padding: 0 0 48px;
  }

  .header {
    background: var(--bg);
    border-bottom: 1px solid var(--bd);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-logo {
    font-size: 13px;
    font-weight: 700;
    color: var(--tx1);
    letter-spacing: -.3px;
  }

  .header-sep { color: var(--bd); }

  .header-lbl {
    font-size: 12px;
    color: var(--tx3);
  }

  .wrap {
    max-width: 560px;
    margin: 28px auto 0;
    padding: 0 16px;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .status-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  .camp-titulo {
    font-size: 22px;
    font-weight: 700;
    color: var(--tx1);
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .camp-descricao {
    font-size: 14px;
    color: var(--tx2);
    line-height: 1.55;
    margin-bottom: 16px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .meta-arrecadado {
    font-size: 24px;
    font-weight: 700;
    color: var(--gr);
  }

  .meta-total {
    font-size: 13px;
    color: var(--tx3);
  }

  .progress-bar {
    height: 10px;
    border-radius: 5px;
    background: var(--bd);
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 5px;
    background: var(--violet);
    transition: width .6s ease;
  }

  .progress-fill.done { background: var(--gr); }

  .pct-label {
    font-size: 12px;
    color: var(--tx3);
    text-align: right;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }

  .info-item {
    background: var(--bg2);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .info-lbl {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--tx3);
    margin-bottom: 3px;
  }

  .info-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--tx1);
  }

  .sec-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--tx3);
    margin-bottom: 10px;
  }

  .pix-box {
    background: var(--bg2);
    border: 1px dashed var(--bd);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .pix-key {
    font-size: 14px;
    font-weight: 600;
    color: var(--tx1);
    word-break: break-all;
    flex: 1;
  }

  .btn-copy {
    flex-shrink: 0;
    background: var(--violet);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-copy:active { opacity: .8; }

  .pix-hint {
    font-size: 11.5px;
    color: var(--tx3);
    line-height: 1.45;
  }

  .finalidade-box {
    background: var(--bg2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--tx2);
    line-height: 1.55;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .empty-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--tx1);
    margin-bottom: 6px;
  }

  .empty-sub {
    font-size: 14px;
    color: var(--tx3);
  }

  .bank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--bd);
  }

  .bank-logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    flex-shrink: 0;
  }

  .bank-bradesco { background: #cc1f2d; color: #fff; }
  .bank-itau     { background: #ec7000; color: #fff; font-size:16px; }
  .bank-pix      { background: #32bcad; color: #fff; font-size:10px; letter-spacing:.5px; }
  .bank-email    { background: var(--bg2); color: var(--tx2); font-size:18px; border:1px solid var(--bd); }

  .bank-info { flex: 1; min-width: 0; }

  .bank-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--tx3);
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-bottom: 2px;
  }

  .bank-val {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--tx1);
  }

  .bank-cnpj {
    font-size: 11px;
    color: var(--tx3);
    margin-top: 1px;
  }

  .footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--tx3);
    margin-top: 32px;
  }

  @media (max-width: 480px) {
    .wrap { padding: 0 12px; }
    .card { padding: 18px 16px; }
    .camp-titulo { font-size: 20px; }
    .meta-arrecadado { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <img src="/icons/logo-ippenha.svg" height="36" alt="IPPenha" onerror="this.style.display='none'">
  <span class="header-lbl">Campanha de arrecadação</span>
</div>

<div class="wrap" id="wrap">
  <div class="empty-state">
    <div style="font-size:13px;color:var(--tx3)">Carregando...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://erhwryfzpycahgsohhbh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyaHdyeWZ6cHljYWhnc29oaGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg2MTUsImV4cCI6MjA5MTg0NDYxNX0.T0hp90Bmufj6a3oUPq1vYcLiGx9YjyMaZiE38S0e3_8";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_CFG = {
  rascunho:             { label: "Rascunho",             cor: "#9ca3af", bg: "rgba(156,163,175,.15)" },
  aguardando_aprovacao: { label: "Aguardando Aprovação", cor: "#d97706", bg: "rgba(217,119,6,.12)"   },
  aprovada:             { label: "Aprovada",              cor: "#0d9488", bg: "rgba(13,148,136,.12)"  },
  publicada:            { label: "Publicada",             cor: "#2563eb", bg: "rgba(37,99,235,.12)"   },
  em_andamento:         { label: "Em Andamento",          cor: "#7c3aed", bg: "rgba(124,58,237,.12)"  },
  meta_atingida:        { label: "Meta Atingida",         cor: "#16a34a", bg: "rgba(22,163,74,.12)"   },
  encerrada:            { label: "Encerrada",             cor: "#6b7280", bg: "rgba(107,114,128,.12)" },
  suspensa:             { label: "Suspensa",              cor: "#d97706", bg: "rgba(217,119,6,.12)"   },
  cancelada:            { label: "Cancelada",             cor: "#dc2626", bg: "rgba(220,38,38,.12)"   },
};

function brl(v) {
  const n = Number(v || 0).toFixed(2);
  const [int, dec] = n.split(".");
  return "R$ " + int.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + dec;
}

function fmtD(d) {
  if (!d) return null;
  const s = (d.split("T")[0] || d).split("-");
  return `${s[2]}/${s[1]}/${s[0]}`;
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function pct(arr, meta) {
  if (!meta || meta <= 0) return null;
  return Math.min(Math.round((arr / meta) * 100), 100);
}

async function load() {
  const wrap = document.getElementById("wrap");
  const params = new URLSearchParams(window.location.search);
  const c = params.get("c");

  if (!c) {
    renderError("Campanha não especificada.", "Use o link correto fornecido pela IPPenha.");
    return;
  }

  // Tenta por codigo_campanha, depois por id
  // Filtro publica=true aplicado pela RLS (policy anon) — não duplicado aqui
  let { data: camp, error: e1 } = await sb.from("ofertas_especiais")
    .select("*")
    .eq("codigo_campanha", c)
    .maybeSingle();

  if (!camp) {
    const { data, error: e2 } = await sb.from("ofertas_especiais")
      .select("*")
      .eq("id", c)
      .maybeSingle();
    camp = data;
    if (e2) { renderError("Erro ao carregar campanha.", e2.message); return; }
  }

  if (!camp) {
    renderError(
      "Campanha não encontrada.",
      "Ela pode não estar publicada ainda ou o link está incorreto."
    );
    return;
  }

  if (!camp.publica) {
    renderError("Campanha não disponível.", "Esta campanha ainda não foi publicada.");
    return;
  }

  if (["cancelada", "suspensa"].includes(camp.status)) {
    renderError("Campanha indisponível.", `Esta campanha está ${STATUS_CFG[camp.status]?.label.toLowerCase() || camp.status}.`);
    return;
  }

  // Arrecadado confirmado
  const { data: totais } = await sb.from("oe_contribuicoes")
    .select("valor")
    .eq("campanha_id", camp.id)
    .eq("status_conciliacao", "confirmada");

  const arrecadado = (totais || []).reduce((s, r) => s + Number(r.valor || 0), 0)
                   + Number(camp.valor_inicial || 0);

  const p = pct(arrecadado, camp.meta);
  const st = STATUS_CFG[camp.status] || { label: camp.status, cor: "#9ca3af", bg: "rgba(156,163,175,.15)" };

  document.title = `${camp.titulo} — IPPenha`;

  const dataIni = fmtD(camp.data_inicio);
  const dataFim = !camp.sem_data_fim ? fmtD(camp.data_fim) : null;
  const inp = "width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;color:var(--tx1);font-size:13px;padding:10px 12px;outline:none;font-family:inherit";

  wrap.innerHTML = `
    <div class="card" style="padding:${camp.imagem_url ? "0" : "22px 20px"}">
      ${camp.imagem_url ? `<img src="${escHtml(camp.imagem_url)}" alt="${escHtml(camp.titulo)}"
        style="width:100%;height:auto;display:block;border-radius:var(--radius) var(--radius) 0 0">
        <div style="padding:22px 20px">` : ""}
      ${!["publicada","em_andamento"].includes(camp.status) ? `<span class="status-pill" style="color:${st.cor};background:${st.bg}">${st.label}</span>` : ""}
      <div class="camp-titulo">${escHtml(camp.titulo)}</div>
      ${camp.descricao ? `<div class="camp-descricao">${escHtml(camp.descricao)}</div>` : ""}

      <div class="meta-row">
        <div class="meta-arrecadado">${brl(arrecadado)}</div>
        ${!camp.sem_meta ? `<div class="meta-total">de ${brl(camp.meta)}</div>` : ""}
      </div>

      ${p !== null ? `
      <div class="progress-bar">
        <div class="progress-fill ${p >= 100 ? "done" : ""}" style="width:${p}%"></div>
      </div>
      <div class="pct-label">${p}% da meta atingida</div>
      ` : `<div style="font-size:12px;color:var(--tx3);margin-bottom:4px">Sem meta definida</div>`}

      ${(dataIni || dataFim || camp.categoria || camp.departamento) ? `
      <div class="info-grid">
        ${dataIni ? `<div class="info-item"><div class="info-lbl">Início</div><div class="info-val">${dataIni}</div></div>` : ""}
        ${dataFim ? `<div class="info-item"><div class="info-lbl">Encerramento</div><div class="info-val">${dataFim}</div></div>` : ""}
        ${camp.categoria ? `<div class="info-item"><div class="info-lbl">Categoria</div><div class="info-val">${escHtml(camp.categoria)}</div></div>` : ""}
        ${camp.departamento ? `<div class="info-item"><div class="info-lbl">Departamento</div><div class="info-val">${escHtml(camp.departamento)}</div></div>` : ""}
      </div>` : ""}
    ${camp.imagem_url ? "</div>" : ""}
    </div>

    ${camp.chave_pix ? `
    <div class="card">
      <div class="sec-title">Como contribuir</div>
      <div class="pix-box">
        <div class="pix-key">${escHtml(camp.chave_pix)}</div>
        <button class="btn-copy" id="btn-pix-copy" onclick="copiarPix('${escHtml(camp.chave_pix)}')">Copiar</button>
      </div>
      <div class="pix-hint">Copie a chave PIX e faça a transferência pelo seu banco. Depois, informe o comprovante à IPPenha.</div>
    </div>` : ""}

    ${camp.finalidade_recursos ? `
    <div class="card">
      <div class="sec-title">Finalidade dos recursos</div>
      <div class="finalidade-box">${escHtml(camp.finalidade_recursos)}</div>
    </div>` : ""}

    <div class="card">
      <div class="sec-title">Formas de contribuição</div>

      <div class="bank-item">
        <div class="bank-logo bank-pix">PIX</div>
        <div class="bank-info">
          <div class="bank-name">Chave PIX — CNPJ</div>
          <div class="bank-val" id="pix-cnpj-val">62.946.058/0001-80</div>
        </div>
        <button class="btn-copy" onclick="copiarPix('62.946.058/0001-80')" id="btn-pix-cnpj">Copiar</button>
      </div>

      <div class="bank-item">
        <div class="bank-logo bank-bradesco">B</div>
        <div class="bank-info">
          <div class="bank-name">Bradesco</div>
          <div class="bank-val">Ag. 0118-0 &nbsp;|&nbsp; C/C 208606-9</div>
          <div class="bank-cnpj">CNPJ 62.946.058/0001-80</div>
        </div>
      </div>

      <div class="bank-item">
        <div class="bank-logo bank-itau">i</div>
        <div class="bank-info">
          <div class="bank-name">Itaú</div>
          <div class="bank-val">Ag. 0738 &nbsp;|&nbsp; C/C 51137-7</div>
          <div class="bank-cnpj">CNPJ 62.946.058/0001-80</div>
        </div>
      </div>

      <div class="bank-item" style="border-bottom:none">
        <div class="bank-logo bank-email">@</div>
        <div class="bank-info">
          <div class="bank-name">E-mail da tesouraria</div>
          <div class="bank-val">tesouraria.ippenha@gmail.com</div>
        </div>
        <button class="btn-copy" onclick="copiarPix('tesouraria.ippenha@gmail.com')">Copiar</button>
      </div>
    </div>

    <div class="card" id="card-contrib-form">
      <div class="sec-title">Participar desta campanha</div>

      <div id="contrib-success" style="display:none;text-align:center;padding:24px 0">
        <div style="font-size:32px;margin-bottom:8px">✓</div>
        <div style="font-size:16px;font-weight:700;color:var(--tx1);margin-bottom:4px" id="contrib-success-title">Registrado!</div>
        <div style="font-size:13px;color:var(--tx3)" id="contrib-success-sub">A tesouraria irá confirmar em breve.</div>
        <button onclick="resetContribForm()" style="margin-top:16px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;color:var(--tx2)">Registrar outro</button>
      </div>

      <div id="contrib-fields">
        <!-- Seletor de tipo -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
          <label id="tipo-unico-lbl" style="display:flex;align-items:center;gap:8px;padding:11px 14px;border:2px solid var(--violet);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--tx1)">
            <input type="radio" name="cf-tipo" value="unico" checked onchange="cfTipoChange()"> Já contribuí
          </label>
          <label id="tipo-rec-lbl" style="display:flex;align-items:center;gap:8px;padding:11px 14px;border:2px solid var(--bd);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--tx2)">
            <input type="radio" name="cf-tipo" value="recorrente" onchange="cfTipoChange()"> Vou contribuir
          </label>
        </div>
        <p id="cf-tipo-desc" style="font-size:12.5px;color:var(--tx3);margin-bottom:14px;line-height:1.5">
          Informe os dados do pagamento que você já realizou para que a tesouraria possa confirmar.
        </p>

        <div style="display:grid;gap:12px">
          <!-- Busca de membro -->
          <div>
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Seu nome</label>

            <!-- Membro selecionado -->
            <div id="cf-membro-sel" style="display:none;align-items:center;gap:8px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);border-radius:8px;padding:9px 12px;margin-bottom:6px">
              <span style="font-size:13px;font-weight:600;color:var(--tx1);flex:1" id="cf-membro-nome-exib"></span>
              <button onclick="cfLimparMembro()" style="background:none;border:none;cursor:pointer;color:var(--tx3);font-size:16px;padding:0;line-height:1">×</button>
            </div>

            <!-- Campo de busca (oculto após seleção) -->
            <div id="cf-busca-wrap" style="position:relative">
              <input id="cf-nome-busca" type="text" placeholder="Digite seu nome para buscar..."
                     oninput="cfNomeBuscar(this.value)"
                     autocomplete="off"
                     style="${inp}">
              <div id="cf-nome-dd" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:99;overflow:hidden;max-height:220px;overflow-y:auto"></div>
            </div>

            <!-- Checkbox não membro -->
            <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:12.5px;color:var(--tx2)">
              <input type="checkbox" id="cf-nao-membro" onchange="cfNaoMembroChange()">
              Não sou membro
            </label>

            <!-- Campo nome manual (só aparece quando "Não sou membro") -->
            <div id="cf-nome-manual-wrap" style="display:none;margin-top:8px">
              <input id="cf-nome-manual" type="text" placeholder="Como prefere ser identificado (opcional)" style="${inp}">
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Valor (R$) *</label>
              <input id="cf-valor" type="text" inputmode="numeric" placeholder="Ex: 500,00" style="${inp}" oninput="cfMascaraValor(this)">
            </div>
            <!-- Campo único: data do pagamento -->
            <div id="cf-data-wrap">
              <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Data do pagamento</label>
              <input id="cf-data" type="date" value="${new Date().toISOString().split('T')[0]}" style="${inp}">
            </div>
          </div>

          <!-- Campo único: forma de pagamento -->
          <div id="cf-forma-wrap">
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Forma de pagamento</label>
            <select id="cf-forma" style="${inp}">
              <option value="pix">PIX</option>
              <option value="transferencia">Transferência bancária</option>
              <option value="dinheiro">Dinheiro</option>
              <option value="cartao">Cartão</option>
              <option value="boleto">Boleto</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <!-- Campos recorrentes -->
          <div id="cf-rec-wrap" style="display:none;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Frequência</label>
              <select id="cf-frequencia" style="${inp}" onchange="cfFreqChange(this.value)">
                <option value="uma_vez">Uma Vez</option>
                <option value="semanal">Semanal</option>
                <option value="quinzenal">Quinzenal</option>
                <option value="mensal" selected>Mensal</option>
                <option value="bimestral">Bimestral</option>
                <option value="trimestral">Trimestral</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Quantas vezes <span style="font-weight:400;text-transform:none">(opcional)</span></label>
              <input id="cf-qtd" type="number" min="1" placeholder="Ex: 6" style="${inp}">
            </div>
          </div>
          <div id="cf-inicio-wrap" style="display:none">
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Data de início</label>
            <input id="cf-inicio" type="date" value="${new Date().toISOString().split('T')[0]}" style="${inp}">
          </div>

          <div>
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px" id="cf-obs-lbl">Observações <span style="font-weight:400;text-transform:none">(ex: número do comprovante)</span></label>
            <input id="cf-obs" type="text" placeholder="Referência, nº do comprovante, etc." style="${inp}">
          </div>

          <div id="cf-comp-wrap">
            <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);display:block;margin-bottom:5px">Comprovante <span style="font-weight:400;text-transform:none">(opcional)</span></label>
            <div id="cf-comp-area" onclick="document.getElementById('cf-comp-file').click()"
                 style="border:1.5px dashed var(--bd);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx3)">
              <span style="font-size:18px">📎</span>
              <span id="cf-comp-label">Clique para anexar imagem ou PDF</span>
              <button id="cf-comp-clear" onclick="event.stopPropagation();cfCompLimpar()" style="display:none;margin-left:auto;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:16px;line-height:1">✕</button>
            </div>
            <input id="cf-comp-file" type="file" accept="image/*,.pdf" style="display:none" onchange="cfCompChange(this)">
          </div>

          <button id="cf-btn" onclick="enviarContrib('${camp.id}')"
                  style="width:100%;padding:13px;background:var(--violet);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px">
            Registrar contribuição
          </button>
        </div>
      </div>
    </div>

    <div class="footer">
      SIPEN — Sistema Integrado da IPPenha
    </div>
  `;
}

// ── Estado do membro selecionado ──────────────────────────
let _cfPessoaId   = null;
let _cfPessoaNome = null;
let _cfBuscaTimer = null;

function cfNomeBuscar(q) {
  clearTimeout(_cfBuscaTimer);
  const dd = document.getElementById("cf-nome-dd");
  if (!q || q.length < 2) { dd.style.display = "none"; return; }
  _cfBuscaTimer = setTimeout(async () => {
    const { data } = await sb.from("pessoas")
      .select("id,nome")
      .ilike("nome", `%${q}%`)
      .is("deleted_at", null)
      .order("nome")
      .limit(8);
    if (!data || !data.length) { dd.style.display = "none"; return; }
    dd.innerHTML = data.map(p => `
      <button onclick="cfSelecionarMembro('${p.id}','${p.nome.replace(/'/g,"\\'")}',this)"
              style="display:block;width:100%;text-align:left;padding:9px 14px;border:none;background:transparent;font-size:13px;color:var(--tx1);cursor:pointer;border-bottom:1px solid var(--bd)"
              onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background='transparent'">
        ${p.nome}
      </button>`).join("");
    dd.style.display = "block";
  }, 280);
}

function cfSelecionarMembro(id, nome) {
  _cfPessoaId   = id;
  _cfPessoaNome = nome;
  document.getElementById("cf-nome-dd").style.display   = "none";
  document.getElementById("cf-busca-wrap").style.display = "none";
  document.getElementById("cf-membro-sel").style.display = "flex";
  document.getElementById("cf-membro-nome-exib").textContent = nome;
}

function cfLimparMembro() {
  _cfPessoaId   = null;
  _cfPessoaNome = null;
  document.getElementById("cf-membro-sel").style.display  = "none";
  document.getElementById("cf-busca-wrap").style.display   = "";
  document.getElementById("cf-nome-busca").value           = "";
}

function cfNaoMembroChange() {
  const naoMembro = document.getElementById("cf-nao-membro")?.checked;
  document.getElementById("cf-busca-wrap").style.display      = naoMembro ? "none" : "";
  document.getElementById("cf-nome-manual-wrap").style.display = naoMembro ? "" : "none";
  document.getElementById("cf-membro-sel").style.display      = "none";
  cfLimparMembro();
}

function _cfGetNome() {
  const naoMembro = document.getElementById("cf-nao-membro")?.checked;
  if (naoMembro) return document.getElementById("cf-nome-manual")?.value?.trim() || null;
  return _cfPessoaNome || document.getElementById("cf-nome-busca")?.value?.trim() || null;
}

function cfCompChange(input) {
  const file = input.files?.[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert("Arquivo muito grande. Máximo 10 MB."); input.value = ""; return; }
  document.getElementById("cf-comp-label").textContent = file.name;
  document.getElementById("cf-comp-label").style.color = "var(--tx1)";
  document.getElementById("cf-comp-clear").style.display = "";
}

function cfCompLimpar() {
  document.getElementById("cf-comp-file").value = "";
  document.getElementById("cf-comp-label").textContent = "Clique para anexar imagem ou PDF";
  document.getElementById("cf-comp-label").style.color = "";
  document.getElementById("cf-comp-clear").style.display = "none";
}

function cfMascaraValor(input) {
  let v = input.value.replace(/\D/g, "");
  if (!v) { input.value = ""; return; }
  v = (parseInt(v, 10) / 100).toFixed(2);
  input.value = v.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function parseBRL(s) {
  if (!s) return 0;
  const str = String(s).trim();
  if (str.includes(",")) return parseFloat(str.replace(/\./g, "").replace(",", ".")) || 0;
  return parseFloat(str) || 0;
}

function cfTipoChange() {
  const tipo = document.querySelector("input[name='cf-tipo']:checked")?.value;
  const isRec = tipo === "recorrente";

  const lblUnico = document.getElementById("tipo-unico-lbl");
  const lblRec   = document.getElementById("tipo-rec-lbl");
  if (lblUnico) { lblUnico.style.borderColor = isRec ? "var(--bd)" : "var(--violet)"; lblUnico.style.color = isRec ? "var(--tx2)" : "var(--tx1)"; }
  if (lblRec)   { lblRec.style.borderColor   = isRec ? "var(--violet)" : "var(--bd)"; lblRec.style.color   = isRec ? "var(--tx1)" : "var(--tx2)"; }

  const desc    = document.getElementById("cf-tipo-desc");
  const btn     = document.getElementById("cf-btn");
  const obsLbl  = document.getElementById("cf-obs-lbl");
  const obsInp  = document.getElementById("cf-obs");

  if (desc) desc.textContent = isRec
    ? "Registre seu comprometimento de contribuição recorrente. A tesouraria irá acompanhar."
    : "Informe os dados do pagamento que você já realizou para que a tesouraria possa confirmar.";

  if (btn)    btn.textContent = isRec ? "Registrar comprometimento" : "Registrar contribuição";
  if (obsLbl) obsLbl.innerHTML = isRec
    ? 'Observações <span style="font-weight:400;text-transform:none">(opcional)</span>'
    : 'Observações <span style="font-weight:400;text-transform:none">(ex: número do comprovante)</span>';
  if (obsInp) obsInp.placeholder = isRec ? "Motivo, intenção, etc." : "Referência, nº do comprovante, etc.";

  document.getElementById("cf-data-wrap")?.style  && (document.getElementById("cf-data-wrap").style.display   = isRec ? "none" : "");
  document.getElementById("cf-forma-wrap")?.style  && (document.getElementById("cf-forma-wrap").style.display  = isRec ? "none" : "");
  document.getElementById("cf-rec-wrap")?.style    && (document.getElementById("cf-rec-wrap").style.display    = isRec ? "grid" : "none");
  document.getElementById("cf-inicio-wrap")?.style && (document.getElementById("cf-inicio-wrap").style.display = isRec ? "" : "none");
  if (isRec) cfFreqChange(document.getElementById("cf-frequencia")?.value || "mensal");
}

function cfFreqChange(val) {
  const umaVez = val === "uma_vez";
  const qtdWrap = document.getElementById("cf-qtd")?.parentElement;
  if (qtdWrap) qtdWrap.style.display = umaVez ? "none" : "";
  const inicioWrap = document.getElementById("cf-inicio-wrap");
  if (inicioWrap) {
    const lbl = inicioWrap.querySelector("label");
    if (lbl) lbl.childNodes[0].textContent = umaVez ? "Data prevista" : "Data de início";
  }
}

async function enviarContrib(campanhaId) {
  const btn  = document.getElementById("cf-btn");
  const tipo = document.querySelector("input[name='cf-tipo']:checked")?.value || "unico";
  const valor = parseBRL(document.getElementById("cf-valor")?.value);
  if (!valor || valor <= 0) {
    alert("Informe um valor válido.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Registrando...";

  const nome = _cfGetNome();
  let error;

  if (tipo === "recorrente") {
    const frequencia = document.getElementById("cf-frequencia")?.value || "mensal";
    const umaVez     = frequencia === "uma_vez";
    const qtd        = umaVez ? 1 : (parseInt(document.getElementById("cf-qtd")?.value || 0) || null);
    const obsBase    = document.getElementById("cf-obs")?.value?.trim() || null;
    const obs        = [obsBase, qtd && !umaVez ? `${qtd} parcela${qtd > 1 ? "s" : ""}` : null].filter(Boolean).join(" · ") || null;

    const payload = {
      campanha_id:       campanhaId,
      pessoa_id:         _cfPessoaId || null,
      nome_contribuinte: nome,
      tipo:              umaVez ? "unico" : "recorrente",
      valor,
      frequencia:        umaVez ? null : frequencia,
      data_inicio:       document.getElementById("cf-inicio")?.value || new Date().toISOString().split("T")[0],
      status:            "ativo",
      obs,
    };
    ({ error } = await sb.from("oe_comprometimentos").insert(payload));
  } else {
    let comprovante_url = null;
    const compFile = document.getElementById("cf-comp-file")?.files?.[0];
    if (compFile) {
      if (btn) btn.textContent = "Enviando comprovante...";
      const ext  = compFile.name.split(".").pop().toLowerCase() || "jpg";
      const path = `comprovantes/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/campanhas/${path}`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
          "Content-Type": compFile.type || "application/octet-stream",
        },
        body: compFile,
      });
      if (!resp.ok) {
        const err = await resp.text().catch(() => `HTTP ${resp.status}`);
        alert("Erro no upload do comprovante: " + err);
        btn.disabled = false;
        btn.textContent = "Registrar contribuição";
        return;
      }
      comprovante_url = `${SUPABASE_URL}/storage/v1/object/public/campanhas/${path}`;
    }

    const payload = {
      campanha_id:        campanhaId,
      nome_contribuinte:  nome,
      anonimo:            !nome,
      valor,
      data:               document.getElementById("cf-data")?.value || new Date().toISOString().split("T")[0],
      forma:              document.getElementById("cf-forma")?.value || "pix",
      obs:                document.getElementById("cf-obs")?.value?.trim() || null,
      comprovante_url,
      origem:             "publico",
      status_conciliacao: "aguardando",
    };
    ({ error } = await sb.from("oe_contribuicoes").insert(payload));
  }

  if (error) {
    alert("Erro ao registrar: " + error.message);
    btn.disabled = false;
    btn.textContent = tipo === "recorrente" ? "Registrar comprometimento" : "Registrar contribuição";
    return;
  }

  const successTitle = document.getElementById("contrib-success-title");
  const successSub   = document.getElementById("contrib-success-sub");
  if (tipo === "recorrente") {
    if (successTitle) successTitle.textContent = "Comprometimento registrado!";
    if (successSub)   successSub.textContent   = "Obrigado! A tesouraria irá acompanhar suas contribuições.";
  } else {
    if (successTitle) successTitle.textContent = "Contribuição registrada!";
    if (successSub)   successSub.textContent   = "A tesouraria irá confirmar em breve.";
  }
  document.getElementById("contrib-fields").style.display = "none";
  document.getElementById("contrib-success").style.display = "block";
}

function resetContribForm() {
  document.getElementById("contrib-fields").style.display = "";
  document.getElementById("contrib-success").style.display = "none";
  ["cf-valor","cf-obs","cf-qtd","cf-nome-busca","cf-nome-manual"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  cfLimparMembro();
  cfCompLimpar();
  const naoMembro = document.getElementById("cf-nao-membro");
  if (naoMembro) { naoMembro.checked = false; cfNaoMembroChange(); }
  const radioUnico = document.querySelector("input[name='cf-tipo'][value='unico']");
  if (radioUnico) { radioUnico.checked = true; cfTipoChange(); }
  const btn = document.getElementById("cf-btn");
  if (btn) { btn.disabled = false; btn.textContent = "Registrar contribuição"; }
}

function copiarPix(chave) {
  navigator.clipboard.writeText(chave).then(() => {
    const btn = document.getElementById("btn-pix-copy");
    if (btn) { btn.textContent = "Copiada!"; setTimeout(() => { btn.textContent = "Copiar"; }, 2000); }
  });
}

function renderError(titulo, sub) {
  document.getElementById("wrap").innerHTML = `
    <div class="empty-state">
      <div class="empty-title">${escHtml(titulo)}</div>
      <div class="empty-sub">${escHtml(sub)}</div>
    </div>
    <div class="footer">SIPEN — Sistema Integrado da IPPenha</div>
  `;
}

load();
</script>
</body>
</html>

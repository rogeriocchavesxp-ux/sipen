<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eleições — IPPenha</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<style>
/* ── Tokens ─────────────────────────────────────────── */
:root {
  --green:        #2E6E48;
  --green-mid:    #3A8A5A;
  --green-tint:   #EBF5EF;
  --green-border: #C0DECA;
  --amber:        #9A5F1E;
  --amber-tint:   #FBF2E6;
  --amber-border: #E5C99A;

  --tx1:  #1B2019;
  --tx2:  #506050;
  --tx3:  #8C9A8A;
  --tx4:  #B0BDB0;

  --bg:      #F7F8F4;
  --surface: #FFFFFF;
  --bd:      #DEE4DC;
  --bd2:     #CDD5CB;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;

  --f-serif: Georgia, 'Palatino Linotype', 'Times New Roman', serif;
  --f-sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --green:        #4AAF72;
    --green-mid:    #4AAF72;
    --green-tint:   #162A1F;
    --green-border: #264035;
    --amber:        #D4903A;
    --amber-tint:   #231A0C;
    --amber-border: #5A4020;

    --tx1:  #E2E7DF;
    --tx2:  #9AAA95;
    --tx3:  #5A6858;
    --tx4:  #3A4A38;

    --bg:      #131611;
    --surface: #1A1E18;
    --bd:      #272E24;
    --bd2:     #323A30;
  }
}

:root[data-theme="light"] {
  --green: #2E6E48; --green-mid: #3A8A5A; --green-tint: #EBF5EF; --green-border: #C0DECA;
  --amber: #9A5F1E; --amber-tint: #FBF2E6; --amber-border: #E5C99A;
  --tx1: #1B2019; --tx2: #506050; --tx3: #8C9A8A; --tx4: #B0BDB0;
  --bg: #F7F8F4; --surface: #FFFFFF; --bd: #DEE4DC; --bd2: #CDD5CB;
}
:root[data-theme="dark"] {
  --green: #4AAF72; --green-mid: #4AAF72; --green-tint: #162A1F; --green-border: #264035;
  --amber: #D4903A; --amber-tint: #231A0C; --amber-border: #5A4020;
  --tx1: #E2E7DF; --tx2: #9AAA95; --tx3: #5A6858; --tx4: #3A4A38;
  --bg: #131611; --surface: #1A1E18; --bd: #272E24; --bd2: #323A30;
}

/* ── Reset ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--f-sans);
  background: var(--bg);
  color: var(--tx1);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Page shell ──────────────────────────────────────── */
.page-wrap   { max-width: 720px; margin: 0 auto; padding: 32px 20px 72px; }
.page-header { display: flex; justify-content: center; padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--bd); }
.page-logo   { width: 200px; height: auto; }
.page-footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--tx3); letter-spacing: .02em; }

/* ── Process header ──────────────────────────────────── */
.proc-header   { margin-bottom: 32px; }
.proc-eyebrow  { font-size: 11px; font-weight: 600; color: var(--green); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; }
.proc-title    { font-family: var(--f-serif); font-size: clamp(26px, 5vw, 36px); font-weight: normal; color: var(--tx1); line-height: 1.2; text-wrap: balance; margin-bottom: 12px; }
.proc-subtitle { font-size: 15px; color: var(--tx2); line-height: 1.7; max-width: 560px; margin-bottom: 20px; }
.proc-meta     { display: flex; flex-wrap: wrap; gap: 8px; }
.meta-chip     { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--bd2); background: var(--surface); font-size: 12.5px; color: var(--tx2); white-space: nowrap; }
.meta-chip.s-aberto   { color: var(--green); background: var(--green-tint); border-color: var(--green-border); }
.meta-chip.s-agendado { color: var(--amber); background: var(--amber-tint); border-color: var(--amber-border); }
.meta-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* ── Divider ─────────────────────────────────────────── */
.sec-divider { border: none; border-top: 1px solid var(--bd); margin: 0 0 28px; }

/* ── Participation card ──────────────────────────────── */
.join-card { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius-lg); padding: 28px 28px 24px; margin-bottom: 20px; }
.join-title { font-family: var(--f-serif); font-size: 20px; font-weight: normal; color: var(--tx1); margin-bottom: 12px; }
.join-text  { font-size: 14px; color: var(--tx2); line-height: 1.75; }
.join-ori   { margin-top: 16px; padding: 12px 16px; border-left: 3px solid var(--green-border); background: var(--green-tint); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13.5px; color: var(--tx2); line-height: 1.65; font-style: italic; }
.cta-btn    { display: block; width: 100%; margin-top: 22px; padding: 14px 28px; border-radius: var(--radius); border: none; background: var(--green); color: #fff; font-family: var(--f-sans); font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: .02em; transition: background .15s, opacity .15s; }
.cta-btn:hover    { background: var(--green-mid); }
.cta-btn:disabled { opacity: .5; cursor: not-allowed; }
@media (min-width: 540px) { .cta-btn { width: auto; } }

/* ── Info grid ───────────────────────────────────────── */
.info-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 0; }
@media (min-width: 540px) { .info-grid { grid-template-columns: 1fr 1fr; } }

.info-card       { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius-lg); padding: 22px 24px; }
.info-card-title { font-size: 11px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .09em; margin-bottom: 16px; }

.req-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.req-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--tx2); line-height: 1.5; }
.req-check { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--green-tint); border: 1px solid var(--green-border); color: var(--green); font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.scripture-hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bd); font-size: 12px; color: var(--tx3); }
.scripture-hint strong { color: var(--green); font-weight: 600; }

.detail-list { display: flex; flex-direction: column; gap: 10px; }
.detail-row  { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; padding-bottom: 10px; border-bottom: 1px solid var(--bd); }
.detail-row:last-child { padding-bottom: 0; border-bottom: none; }
.detail-row dt { color: var(--tx3); flex-shrink: 0; }
.detail-row dd { color: var(--tx1); font-weight: 600; text-align: right; }
.detail-row dd.s-aberto   { color: var(--green); }
.detail-row dd.s-agendado { color: var(--amber); }

/* ── State blocks ────────────────────────────────────── */
.state-block        { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius-lg); padding: 40px 28px; text-align: center; margin-bottom: 20px; }
.state-block h2     { font-family: var(--f-serif); font-size: 22px; font-weight: normal; color: var(--tx1); margin-bottom: 10px; }
.state-block p      { font-size: 14px; color: var(--tx2); line-height: 1.7; max-width: 400px; margin: 0 auto; }
.state-block.ok h2  { color: var(--green); }
.state-block.ok     { border-color: var(--green-border); }

/* ── Step indicator ──────────────────────────────────── */
.steps        { display: flex; align-items: center; margin-bottom: 24px; }
.step         { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--tx4); font-weight: 600; }
.step.on      { color: var(--green); }
.step.done    { color: var(--green); }
.step-n       { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.step.on  .step-n  { background: var(--green-tint); }
.step.done .step-n { background: var(--green-tint); }
.step-sep     { flex: 1; height: 1px; background: var(--bd); margin: 0 10px; }
.step-lbl     { display: none; }
@media (min-width: 440px) { .step-lbl { display: inline; } }

/* ── Identification card ─────────────────────────────── */
.id-card       { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px; }
.id-card-title { font-family: var(--f-serif); font-size: 18px; font-weight: normal; color: var(--tx1); margin-bottom: 6px; }
.id-card-sub   { font-size: 13.5px; color: var(--tx2); margin-bottom: 18px; }

/* ── Member badge ────────────────────────────────────── */
.member-badge { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.member-av    { width: 36px; height: 36px; border-radius: 50%; background: var(--green-tint); border: 1px solid var(--green-border); color: var(--green); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.member-name  { font-size: 14px; font-weight: 600; color: var(--tx1); }
.member-cong  { font-size: 12px; color: var(--tx3); }
.member-swap  { margin-left: auto; padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--bd); background: transparent; color: var(--tx3); font-size: 12px; cursor: pointer; font-family: var(--f-sans); }

/* ── Fields ──────────────────────────────────────────── */
.field       { margin-bottom: 14px; }
.lbl         { display: block; font-size: 10.5px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
.req-star    { color: #C0392B; margin-left: 2px; }
.inp         { width: 100%; padding: 10px 13px; border-radius: var(--radius-sm); border: 1px solid var(--bd2); background: var(--bg); color: var(--tx1); font-size: 14px; font-family: var(--f-sans); outline: none; transition: border-color .15s, box-shadow .15s; }
.inp:focus   { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
.drop-wrap   { position: relative; }
.dropdown    { position: absolute; top: calc(100% + 3px); left: 0; right: 0; z-index: 60; background: var(--surface); border: 1px solid var(--bd2); border-radius: var(--radius); max-height: 230px; overflow-y: auto; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.drop-item   { padding: 10px 14px; font-size: 13.5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--bd); transition: background .1s; }
.drop-item:last-child { border-bottom: none; }
.drop-item:hover      { background: var(--green-tint); }
.drop-item.dis        { cursor: not-allowed; color: var(--tx3); }
.drop-item.dis:hover  { background: none; }
.drop-name   { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop-sub    { font-size: 11.5px; color: var(--tx3); white-space: nowrap; flex-shrink: 0; }
.drop-item.dis .drop-sub { color: #C0392B; }

.sel-ok { display: inline-flex; align-items: center; gap: 8px; background: var(--green-tint); border: 1px solid var(--green-border); color: var(--green); border-radius: 20px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; margin-top: 6px; }
.sel-ok-rm { background: none; border: none; color: var(--green); cursor: pointer; font-size: 14px; padding: 0 0 0 4px; opacity: .7; }
.sel-ok-rm:hover { opacity: 1; }
.field-hint { margin-top: 5px; font-size: 12px; color: var(--tx3); }

/* ── Form action row ─────────────────────────────────── */
.action-row { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
@media (min-width: 440px) { .action-row { flex-direction: row; align-items: center; } }
.btn-sec { padding: 11px 20px; border-radius: var(--radius-sm); border: 1px solid var(--bd2); background: transparent; color: var(--tx2); font-size: 13.5px; cursor: pointer; font-family: var(--f-sans); transition: background .12s; }
.btn-sec:hover { background: var(--bg); }
.btn-pri { padding: 11px 24px; border-radius: var(--radius-sm); border: none; background: var(--green); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: var(--f-sans); transition: background .12s; flex: 1; }
.btn-pri:hover { background: var(--green-mid); }
.btn-pri:disabled { opacity: .5; cursor: not-allowed; }
.form-msg { font-size: 13px; }
.form-msg.err { color: #C0392B; }

/* ── Nomination items ────────────────────────────────── */
.nom-card { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
.nom-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.nom-num  { font-size: 10px; font-weight: 700; color: var(--tx4); text-transform: uppercase; letter-spacing: .1em; }
.nom-rm   { background: none; border: none; color: var(--tx4); cursor: pointer; font-size: 16px; padding: 2px 4px; line-height: 1; transition: color .12s; }
.nom-rm:hover { color: #C0392B; }
.tipo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tipo-opt { display: flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--bd2); background: var(--bg); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--tx2); transition: all .15s; user-select: none; }
.tipo-opt input { display: none; }
.tipo-opt.tp { border-color: var(--green); background: var(--green-tint); color: var(--green); }
.tipo-opt.td { border-color: #4A8FBF; background: rgba(74,143,191,.08); color: #2A6A9A; }

@media (prefers-color-scheme: dark) {
  .tipo-opt.td { color: #6AAFD4; background: rgba(74,143,191,.12); border-color: #2A5070; }
}
:root[data-theme="dark"] .tipo-opt.td { color: #6AAFD4; background: rgba(74,143,191,.12); border-color: #2A5070; }

.add-nom-btn { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: var(--radius-sm); border: 1.5px dashed var(--bd2); background: transparent; color: var(--tx3); font-size: 13.5px; cursor: pointer; font-family: var(--f-sans); transition: all .15s; }
.add-nom-btn:hover { border-color: var(--green); color: var(--green); }

/* ── Submit section ──────────────────────────────────── */
.submit-card { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius-lg); padding: 22px 24px; }
.submit-btn  { display: block; width: 100%; padding: 14px; border-radius: var(--radius); border: none; background: var(--green); color: #fff; font-family: var(--f-sans); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
.submit-btn:hover { background: var(--green-mid); }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── Loader ──────────────────────────────────────────── */
.loader      { text-align: center; padding: 60px 24px; }
.spinner     { display: inline-block; width: 28px; height: 28px; border: 2.5px solid var(--bd); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--green); } }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <img src="/icons/logo-ippenha.svg" class="page-logo" alt="Igreja Presbiteriana da Penha" onerror="this.style.display='none'">
  </div>
  <div id="app"><div class="loader"><div class="spinner"></div></div></div>
  <div class="page-footer">SIPEN — Sistema Integrado da IPPenha</div>
</div>
<script>
/* ── Config ──────────────────────────────────────────── */
const SB_URL = "https://erhwryfzpycahgsohhbh.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyaHdyeWZ6cHljYWhnc29oaGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg2MTUsImV4cCI6MjA5MTg0NDYxNX0.T0hp90Bmufj6a3oUPq1vYcLiGx9YjyMaZiE38S0e3_8";
const HDRS = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };

/* ── Estado ──────────────────────────────────────────── */
let processo  = null;
let membros   = [];
let oficiais  = [];   // oficiais com mandato vencendo no ano do processo
let indicante = null;
let dItems    = [];  // indicações de diáconos
let pItems    = [];  // indicações de presbíteros
let curItems  = [];  // array ativo no momento
let curTipo   = "";  // 'diacono' | 'presbitero'
let itemCtr   = 0;
let etapa     = 1;   // 1=info, 2=id, 3=form1, 4=form2(ambos)

/* ── Helpers ─────────────────────────────────────────── */
function eh(v) {
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtD(d) {
  if (!d) return "—";
  const [y,m,dia] = String(d).slice(0,10).split("-");
  return `${dia}/${m}/${y}`;
}
function fmtNome(s) {
  if (!s) return "";
  const min = new Set(["de","da","do","das","dos","e","a","o","em","na","no","nas","nos"]);
  return String(s).toLowerCase().split(" ").map((w, i) =>
    (!w || (i > 0 && min.has(w))) ? w : w.charAt(0).toUpperCase() + w.slice(1)
  ).join(" ");
}
function calcIdade(dn) {
  if (!dn) return null;
  const h = new Date(), n = new Date(dn + "T00:00:00");
  let a = h.getFullYear() - n.getFullYear();
  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) a--;
  return a;
}
function calcMeses(di) {
  if (!di) return null;
  const h = new Date(), i = new Date(di + "T00:00:00");
  return (h.getFullYear() - i.getFullYear()) * 12 + (h.getMonth() - i.getMonth());
}

async function sbGet(path) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: HDRS });
  if (!r.ok) throw new Error(await r.text().catch(() => `HTTP ${r.status}`));
  return r.json();
}
async function sbPost(path, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    method: "POST",
    headers: { ...HDRS, "Prefer": "return=representation" },
    body: JSON.stringify(body),
  });
  const text = await r.text();
  if (!r.ok) throw new Error(text || `HTTP ${r.status}`);
  let data;
  try { data = JSON.parse(text); } catch { data = []; }
  if (!Array.isArray(data) || data.length === 0) {
    throw new Error("Nenhuma indicação foi salva. Verifique se você está identificado como membro ativo.");
  }
  return data;
}

const STATUS = {
  aberto:    { label: "Processo aberto",  cls: "s-aberto"   },
  agendado:  { label: "Em breve",         cls: "s-agendado" },
  encerrado: { label: "Encerrado",        cls: "s-encerrado"},
  arquivado: { label: "Arquivado",        cls: "s-encerrado"},
  rascunho:  { label: "Em preparação",    cls: "s-encerrado"},
};
const TIPO_NOME = { presbiteros:"presbíteros", diaconos:"diáconos", ambos:"presbíteros e/ou diáconos" };
const TIPO_LBL  = { presbiteros:"Presbíteros", diaconos:"Diáconos", ambos:"Presbíteros e Diáconos"   };

/* ── Init ────────────────────────────────────────────── */
const app  = document.getElementById("app");
const slug = new URLSearchParams(location.search).get("p");

if (!slug) {
  renderErro("Link inválido", "Este link não contém um identificador de processo. Solicite um novo link à secretaria da IPPenha.");
} else {
  init();
}

async function init() {
  try {
    const dados = await sbGet(`eleicao_processos?slug=eq.${encodeURIComponent(slug)}&select=*&limit=1`);
    if (!dados.length) { renderErro("Processo não encontrado", "Este processo eleitoral não existe ou foi removido."); return; }
    processo = dados[0];
    document.title = `${processo.nome} — IPPenha`;
    if (processo.status === "rascunho") { renderErro("Não disponível", "Este processo ainda não está disponível. Aguarde o início das indicações."); return; }

    // Carrega oficiais com mandato vencendo no ano do processo
    try {
      const cargos = processo.tipo === "presbiteros"
        ? "cargo=eq.presbitero"
        : processo.tipo === "diaconos"
        ? "cargo=eq.diacono"
        : "cargo=in.(presbitero,diacono)";
      const ano = processo.ano;
      const todos = await sbGet(
        `v_eleicao_oficiais_mandatos?${cargos}&fim_mandato=gte.${ano}-01-01&fim_mandato=lte.${ano}-12-31&select=nome,cargo,fim_mandato,posse`
      );
      oficiais = todos || [];
    } catch (_) {
      oficiais = [];
    }

    renderInfo();
  } catch (e) {
    renderErro("Erro de conexão", e.message);
  }
}

/* ═══════════════════════════════════════════════════════
   ETAPA 1 — INFORMAÇÕES
═══════════════════════════════════════════════════════ */
function renderInfo() {
  etapa = 1;
  const p  = processo;
  const sc = STATUS[p.status] || STATUS.rascunho;
  const aberto    = p.status === "aberto";
  const agendado  = p.status === "agendado";
  const encerrado = ["encerrado","arquivado"].includes(p.status);

  const periodo = (() => {
    if (p.data_abertura && p.data_encerramento) return `${fmtD(p.data_abertura)} – ${fmtD(p.data_encerramento)}`;
    if (p.data_encerramento) return `até ${fmtD(p.data_encerramento)}`;
    if (p.data_abertura)     return `a partir de ${fmtD(p.data_abertura)}`;
    return null;
  })();

  const subtitulo = p.descricao
    || "Processo oficial de indicação de candidatos ao oficialato da Igreja Presbiteriana da Penha.";

  const tipoTexto = TIPO_NOME[p.tipo] || "oficiais";

  const participacaoTexto = aberto
    ? `Se você é membro apto da Igreja Presbiteriana da Penha, você poderá indicar irmãos que, em sua percepção, possuem vocação e condições para servir como <strong>${tipoTexto}</strong>. Todas as indicações serão recebidas pelo Conselho e utilizadas exclusivamente neste processo eleitoral.`
    : "";

  app.innerHTML = `
    <div class="proc-header">
      <div class="proc-eyebrow">Igreja Presbiteriana da Penha · Processo Eleitoral</div>
      <h1 class="proc-title">${eh(p.nome)}</h1>
      <p class="proc-subtitle">${eh(subtitulo)}</p>
      <div class="proc-meta">
        <div class="meta-chip ${sc.cls}"><span class="meta-dot"></span><span>${sc.label}</span></div>
        ${periodo ? `<div class="meta-chip"><span>${periodo}</span></div>` : ""}
      </div>
    </div>

    <hr class="sec-divider">

    ${oficiais.length ? `
    <div style="background:var(--surface);border:1px solid var(--bd);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px">
        Mandatos vencendo em ${p.ano}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${oficiais.map(o => {
          const isP = o.cargo === "presbitero";
          const cor  = isP ? "var(--green)" : "#2A6A9A";
          const bg   = isP ? "var(--green-tint)" : "rgba(74,143,191,.08)";
          const brd  = isP ? "var(--green-border)" : "rgba(74,143,191,.35)";
          const lbl  = isP ? "Presbítero" : "Diácono";
          return `<div style="display:flex;align-items:center;gap:10px">
            <span style="padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;background:${bg};color:${cor};border:1px solid ${brd};white-space:nowrap;flex-shrink:0">${lbl}</span>
            <span style="font-size:13.5px;color:var(--tx1);font-weight:500">${eh(fmtNome(o.nome))}</span>
            ${o.posse ? `<span style="font-size:11px;color:var(--tx3);margin-left:auto;white-space:nowrap;flex-shrink:0">desde ${fmtD(o.posse)}</span>` : ""}
          </div>`;
        }).join("")}
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--tx3)">
        Estes irmãos podem ser reconduzidos ou substituídos neste processo eleitoral.
      </div>
    </div>` : ""}

    ${aberto ? `
    <div class="join-card">
      <h2 class="join-title">Sua participação é importante</h2>
      <p class="join-text">${participacaoTexto}</p>
      ${p.orientacoes ? `<blockquote class="join-ori">${eh(p.orientacoes)}</blockquote>` : ""}
      <button class="cta-btn" onclick="iniciarIndicacao()">Realizar indicação</button>
    </div>` : agendado ? `
    <div class="state-block">
      <h2>Em breve</h2>
      <p>Este processo ainda não está aberto. As indicações terão início em ${fmtD(p.data_abertura) || "data a confirmar"}.</p>
    </div>` : `
    <div class="state-block">
      <h2>Processo encerrado</h2>
      <p>O prazo para indicações neste processo foi encerrado. Agradecemos a participação de todos os membros.</p>
    </div>`}

    <div class="info-grid">
      <div class="info-card">
        <div class="info-card-title">Quem pode participar?</div>
        <ul class="req-list">
          <li class="req-item"><span class="req-check">✓</span><span>Membros da Igreja Presbiteriana da Penha</span></li>
          <li class="req-item"><span class="req-check">✓</span><span>18 anos ou mais</span></li>
          <li class="req-item"><span class="req-check">✓</span><span>Pelo menos 1 ano de membresia</span></li>
        </ul>
        <div class="scripture-hint">Requisitos bíblicos para o oficialato: <strong>1 Timóteo 3</strong></div>
      </div>
      <div class="info-card">
        <div class="info-card-title">Detalhes do processo</div>
        <dl class="detail-list">
          <div class="detail-row"><dt>Ano</dt><dd>${p.ano}</dd></div>
          <div class="detail-row"><dt>Tipo</dt><dd>${TIPO_LBL[p.tipo] || "Oficiais"}</dd></div>
          <div class="detail-row"><dt>Situação</dt><dd class="${sc.cls}">${sc.label}</dd></div>
          ${p.data_encerramento ? `<div class="detail-row"><dt>Encerramento</dt><dd>${fmtD(p.data_encerramento)}</dd></div>` : ""}
        </dl>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   ETAPA 2 — IDENTIFICAÇÃO
═══════════════════════════════════════════════════════ */
function stepsHtml() {
  const tp = processo?.tipo;
  const isAmbos = tp === "ambos";
  const s = (n) => {
    if (etapa > n)  return "done";
    if (etapa === n) return "on";
    return "";
  };
  const n = (n) => etapa > n ? "✓" : n;

  if (!isAmbos) {
    return `<div class="steps">
      <div class="step done"><div class="step-n">✓</div><span class="step-lbl">Processo</span></div>
      <div class="step-sep"></div>
      <div class="step ${s(2)}"><div class="step-n">${n(2)}</div><span class="step-lbl">Identificação</span></div>
      <div class="step-sep"></div>
      <div class="step ${s(3)}"><div class="step-n">${n(3)}</div><span class="step-lbl">Indicações</span></div>
    </div>`;
  }
  return `<div class="steps">
    <div class="step done"><div class="step-n">✓</div><span class="step-lbl">Processo</span></div>
    <div class="step-sep"></div>
    <div class="step ${s(2)}"><div class="step-n">${n(2)}</div><span class="step-lbl">Identificação</span></div>
    <div class="step-sep"></div>
    <div class="step ${s(3)}"><div class="step-n">${n(3)}</div><span class="step-lbl">Diáconos</span></div>
    <div class="step-sep"></div>
    <div class="step ${s(4)}"><div class="step-n">${n(4)}</div><span class="step-lbl">Presbíteros</span></div>
  </div>`;
}

async function iniciarIndicacao() {
  if (!membros.length) {
    app.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
    try {
      const raw = await sbGet("pessoas?select=id,nome&deleted_at=is.null&order=nome&limit=2000");
      membros = (raw || []).map(p => ({
        pessoa_id: p.id, nome: p.nome,
        congregacao: null, data_nascimento: null, data_ingresso: null,
      }));
    } catch (e) { renderErro("Erro", e.message); return; }
  }
  renderIdentificacao();
}

function renderIdentificacao() {
  etapa = 2;
  app.innerHTML = `
    ${stepsHtml()}
    <div class="id-card">
      <h2 class="id-card-title">Identifique-se</h2>
      <p class="id-card-sub">Busque seu nome na lista de membros da IPPenha para continuar.</p>
      <div class="field">
        <label class="lbl">Seu nome <span class="req-star">*</span></label>
        <div class="drop-wrap">
          <input id="id-inp" class="inp" type="text" placeholder="Digite seu nome..." autocomplete="off"
            oninput="buscarIndicante(this.value)" onblur="fecharDrop('id-drop')">
          <div class="dropdown" id="id-drop"></div>
        </div>
        <div id="id-sel"></div>
      </div>
      <div class="action-row">
        <button class="btn-sec" onclick="renderInfo()">← Voltar</button>
        <button class="btn-pri" onclick="confirmarIdentificacao()">Continuar</button>
      </div>
      <div id="id-msg" class="form-msg" style="margin-top:10px"></div>
    </div>`;
}

window.buscarIndicante = function(q) {
  const drop = document.getElementById("id-drop");
  indicante = null;
  const sel = document.getElementById("id-sel");
  if (sel) sel.innerHTML = "";
  const txt = (q || "").trim().toLowerCase();
  if (txt.length < 2) { drop.style.display = "none"; return; }
  const matches = membros.filter(m => m.nome?.toLowerCase().includes(txt)).slice(0, 10);
  if (!matches.length) {
    const nEsc = eh(q.trim()).replace(/'/g, "\\'");
    drop.innerHTML = `
      <div class="drop-item dis"><span class="drop-name">Nenhum membro encontrado</span></div>
      <div class="drop-item" onclick="selIndicanteManual('${nEsc}')">
        <span class="drop-name">Continuar como "${eh(q.trim())}"</span>
        <span class="drop-sub" style="color:var(--amber)">Nome não está na lista — será registrado como entrada manual</span>
      </div>`;
    drop.style.display = "block"; return;
  }
  drop.innerHTML = matches.map(m => {
    const idade = calcIdade(m.data_nascimento), meses = calcMeses(m.data_ingresso);
    const inv   = (idade !== null && idade < 18) || (meses !== null && meses < 12);
    const sub   = inv ? (idade !== null && idade < 18 ? "Menor de 18 anos" : "< 1 ano de membresia") : (m.congregacao || "Sede");
    const nEsc  = eh(m.nome).replace(/'/g, "\\'");
    return `<div class="drop-item${inv ? " dis" : ""}"
      onclick="${inv ? `alert('Não permitido: ${sub}')` : `selIndicante('${m.pessoa_id}','${nEsc}','${eh(m.congregacao||"Sede")}','${m.data_nascimento||""}','${m.data_ingresso||""}')`}">
      <span class="drop-name">${eh(m.nome)}</span>
      <span class="drop-sub">${sub}</span>
    </div>`;
  }).join("");
  drop.style.display = "block";
};

window.selIndicanteManual = function(nome) {
  indicante = { pessoa_id: null, nome, congregacao: null, data_nascimento: null, data_ingresso: null, manual: true };
  const inp = document.getElementById("id-inp");
  const sel = document.getElementById("id-sel");
  if (inp) { inp.value = nome; document.getElementById("id-drop").style.display = "none"; }
  if (sel) sel.innerHTML = `<div class="sel-ok" style="color:var(--amber)">⚠ ${eh(nome)} — não encontrado na lista <button class="sel-ok-rm" onclick="limparIndicante()">✕</button></div>`;
};

window.selIndicante = function(pid, nome, cong, dn, di) {
  indicante = { pessoa_id: pid, nome, congregacao: cong, data_nascimento: dn, data_ingresso: di };
  const inp = document.getElementById("id-inp");
  const sel = document.getElementById("id-sel");
  if (inp) { inp.value = nome; document.getElementById("id-drop").style.display = "none"; }
  if (sel) sel.innerHTML = `<div class="sel-ok">✓ ${eh(nome)} <button class="sel-ok-rm" onclick="limparIndicante()">✕</button></div>`;
};

window.limparIndicante = function() {
  indicante = null;
  const inp = document.getElementById("id-inp"), sel = document.getElementById("id-sel");
  if (inp) { inp.value = ""; inp.focus(); }
  if (sel) sel.innerHTML = "";
};

window.fecharDrop = function(id) {
  setTimeout(() => { const d = document.getElementById(id); if (d) d.style.display = "none"; }, 200);
};

window.confirmarIdentificacao = async function() {
  const msgEl = document.getElementById("id-msg");
  if (!indicante || !indicante.nome?.trim()) { msgEl.textContent = "Informe seu nome para continuar."; msgEl.className = "form-msg err"; return; }
  const btn = document.querySelector("[onclick='confirmarIdentificacao()']");
  if (btn) { btn.disabled = true; btn.textContent = "Verificando..."; }
  msgEl.textContent = "";
  try {
    if (indicante.pessoa_id) {
      const jaFez = await sbGet(`eleicao_indicacoes?indicante_pessoa_id=eq.${indicante.pessoa_id}&processo_id=eq.${processo.id}&deleted_at=is.null&select=id&limit=1`);
      if (jaFez.length) { renderJaIndicou(); return; }
    }
    renderFormulario();
  } catch (e) {
    msgEl.textContent = "Erro: " + e.message; msgEl.className = "form-msg err";
    if (btn) { btn.disabled = false; btn.textContent = "Continuar"; }
  }
};

/* ═══════════════════════════════════════════════════════
   ETAPAS 3/4 — FORMULÁRIO POR TIPO
═══════════════════════════════════════════════════════ */
function renderFormulario() {
  dItems = []; pItems = []; itemCtr = 0;
  const tp = processo.tipo;
  if (tp === "presbiteros") { renderFormPresbiteros(); return; }
  renderFormDiaconos(); // diaconos only, or ambos starts here
}

function memberBadgeHtml() {
  return `<div class="member-badge">
    <div class="member-av">${eh(indicante.nome[0])}</div>
    <div>
      <div class="member-name">${eh(indicante.nome)}</div>
      <div class="member-cong">${eh(indicante.congregacao)}</div>
    </div>
    <button class="member-swap" onclick="renderIdentificacao()">Trocar</button>
  </div>`;
}

function renderFormDiaconos() {
  etapa = 3;
  curItems = dItems;
  curTipo  = "diacono";
  if (!curItems.length) addItem();
  const isAmbos = processo.tipo === "ambos";
  const ref = "1 Timóteo 3.8–13";

  app.innerHTML = `
    ${stepsHtml()}
    ${memberBadgeHtml()}
    <div class="id-card" style="margin-bottom:14px">
      <h2 class="id-card-title" style="margin-bottom:4px">Indicação de Diáconos</h2>
      <p class="id-card-sub" style="margin-bottom:0">
        Indique irmãos que, em sua percepção, demonstram vocação e condições para o diaconato.
        Requisitos bíblicos: <strong style="color:var(--green)">${ref}</strong>
      </p>
    </div>
    <div id="items-ct"></div>
    <button class="add-nom-btn" onclick="addItemUI()">
      <span style="font-size:18px;line-height:1">+</span> Adicionar indicação
    </button>
    <div class="submit-card" style="margin-top:16px">
      <div class="action-row" style="margin-top:0">
        <button class="btn-sec" onclick="renderIdentificacao()">← Voltar</button>
        ${isAmbos
          ? `<button class="btn-pri" onclick="renderFormPresbiteros()">Próximo: Presbíteros →</button>`
          : `<button class="btn-pri" onclick="submeter()">Enviar indicações</button>`}
      </div>
      <div id="form-msg" class="form-msg" style="margin-top:10px"></div>
    </div>`;

  renderItems();
}

function renderFormPresbiteros() {
  const isAmbos = processo.tipo === "ambos";
  etapa = isAmbos ? 4 : 3;
  curItems = pItems;
  curTipo  = "presbitero";
  if (!curItems.length) addItem();
  const ref = "1 Timóteo 3.1–7";

  app.innerHTML = `
    ${stepsHtml()}
    ${memberBadgeHtml()}
    <div class="id-card" style="margin-bottom:14px">
      <h2 class="id-card-title" style="margin-bottom:4px">Indicação de Presbíteros</h2>
      <p class="id-card-sub" style="margin-bottom:0">
        Indique irmãos que, em sua percepção, demonstram vocação e condições para o presbiterato.
        Requisitos bíblicos: <strong style="color:var(--green)">${ref}</strong>
      </p>
    </div>
    <div id="items-ct"></div>
    <button class="add-nom-btn" onclick="addItemUI()">
      <span style="font-size:18px;line-height:1">+</span> Adicionar indicação
    </button>
    <div class="submit-card" style="margin-top:16px">
      <div class="action-row" style="margin-top:0">
        ${isAmbos
          ? `<button class="btn-sec" onclick="renderFormDiaconos()">← Diáconos</button>`
          : `<button class="btn-sec" onclick="renderIdentificacao()">← Voltar</button>`}
        <button class="btn-pri" onclick="submeter()">Enviar indicações</button>
      </div>
      <div id="form-msg" class="form-msg" style="margin-top:10px"></div>
    </div>`;

  renderItems();
}

function addItem() {
  curItems.push({ id: ++itemCtr, indicado_id: null, indicado_nome: "" });
}

function renderItems() {
  const c = document.getElementById("items-ct");
  if (c) c.innerHTML = curItems.map(it => itemHTML(it)).join("");
  syncAddBtn();
}

function itemHTML(it) {
  const isD = curTipo === "diacono";
  const tagColor = isD ? "var(--bd2)" : "var(--green-border)";
  const tagBg    = isD ? "var(--bg)" : "var(--green-tint)";
  const tagTx    = isD ? "var(--tx3)" : "var(--green)";
  return `
    <div class="nom-card" id="nom-${it.id}">
      <div class="nom-header">
        <span class="nom-num">Indicação ${curItems.indexOf(it) + 1}</span>
        ${curItems.length > 1 ? `<button class="nom-rm" onclick="rmItem(${it.id})" title="Remover">✕</button>` : ""}
      </div>
      <div class="field">
        <label class="lbl">Nome do indicado <span class="req-star">*</span></label>
        <div class="drop-wrap">
          <input id="bi-${it.id}" class="inp" type="text" placeholder="Digite o nome do membro..."
            value="${eh(it.indicado_nome)}" autocomplete="off"
            oninput="buscarIndicado(${it.id},this.value)"
            onblur="fecharDrop('di-${it.id}')">
          <div class="dropdown" id="di-${it.id}"></div>
        </div>
        <div id="si-${it.id}" class="field-hint">
          ${it.indicado_id ? `<span class="sel-ok" style="margin-top:0">✓ ${eh(it.indicado_nome)}</span>` : "Nenhum membro selecionado"}
        </div>
      </div>
    </div>`;
}

window.addItemUI = function() {
  const lim = processo.max_indicacoes ?? 5;
  if (curItems.length >= lim) return;
  addItem();
  const c = document.getElementById("items-ct");
  if (c) c.insertAdjacentHTML("beforeend", itemHTML(curItems[curItems.length - 1]));
  syncRm();
  syncAddBtn();
};
window.rmItem = function(id) {
  curItems.splice(curItems.findIndex(i => i.id === id), 1);
  document.getElementById(`nom-${id}`)?.remove();
  syncRm();
  syncAddBtn();
};
function syncAddBtn() {
  const lim = processo.max_indicacoes ?? 5;
  const btn = document.querySelector(".add-nom-btn");
  if (!btn) return;
  const reached = curItems.length >= lim;
  btn.disabled = reached;
  btn.style.opacity = reached ? ".4" : "";
  btn.style.cursor  = reached ? "not-allowed" : "";
  btn.title = reached ? `Limite de ${lim} indicações por tipo atingido` : "";
}
function syncRm() {
  curItems.forEach((it, idx) => {
    const num = document.querySelector(`#nom-${it.id} .nom-num`);
    if (num) num.textContent = `Indicação ${idx + 1}`;
    const b = document.querySelector(`#nom-${it.id} .nom-rm`);
    if (b) b.style.display = curItems.length > 1 ? "" : "none";
  });
}

window.buscarIndicado = function(id, q) {
  const drop = document.getElementById(`di-${id}`); if (!drop) return;
  const it = curItems.find(i => i.id === id); if (it) { it.indicado_id = null; it.indicado_nome = q; }
  const sel = document.getElementById(`si-${id}`);
  if (sel) { sel.textContent = "Nenhum membro selecionado"; sel.className = "field-hint"; }
  const txt = (q || "").trim().toLowerCase();
  if (txt.length < 2) { drop.style.display = "none"; return; }
  const matches = membros.filter(m => m.nome?.toLowerCase().includes(txt)).slice(0, 10);
  if (!matches.length) {
    const nEsc = eh(q.trim()).replace(/'/g, "\\'");
    drop.innerHTML = `
      <div class="drop-item dis"><span class="drop-name">Nenhum membro encontrado</span></div>
      <div class="drop-item" onclick="selIndicadoManual(${id},'${nEsc}')">
        <span class="drop-name">Indicar "${eh(q.trim())}"</span>
        <span class="drop-sub" style="color:var(--amber)">Nome não está na lista — será registrado como entrada manual</span>
      </div>`;
    drop.style.display = "block"; return;
  }
  drop.innerHTML = matches.map(m => {
    const idade = calcIdade(m.data_nascimento), meses = calcMeses(m.data_ingresso);
    const inv   = (idade !== null && idade < 18) || (meses !== null && meses < 12);
    const sub   = inv ? (idade !== null && idade < 18 ? "Menor de 18 anos" : "< 1 ano") : (m.congregacao || "Sede");
    const nEsc  = eh(m.nome).replace(/'/g, "\\'");
    return `<div class="drop-item${inv ? " dis" : ""}"
      onclick="${inv ? `alert('Não permitido: ${sub}')` : `selIndicado(${id},'${m.pessoa_id}','${nEsc}')`}">
      <span class="drop-name">${eh(m.nome)}</span>
      <span class="drop-sub" style="${inv ? "color:#C0392B" : ""}">${sub}</span>
    </div>`;
  }).join("");
  drop.style.display = "block";
};

window.selIndicado = function(id, pid, nome) {
  const it = curItems.find(i => i.id === id); if (!it) return;
  it.indicado_id = pid; it.indicado_nome = nome; it.manual = false;
  const inp = document.getElementById(`bi-${id}`);
  const drp = document.getElementById(`di-${id}`);
  const sel = document.getElementById(`si-${id}`);
  if (inp) inp.value = nome;
  if (drp) drp.style.display = "none";
  if (sel) sel.innerHTML = `<span class="sel-ok" style="margin-top:0">✓ ${eh(nome)}</span>`;
};

window.selIndicadoManual = function(id, nome) {
  const it = curItems.find(i => i.id === id); if (!it) return;
  it.indicado_id = null; it.indicado_nome = nome; it.manual = true;
  const inp = document.getElementById(`bi-${id}`);
  const drp = document.getElementById(`di-${id}`);
  const sel = document.getElementById(`si-${id}`);
  if (inp) inp.value = nome;
  if (drp) drp.style.display = "none";
  if (sel) sel.innerHTML = `<span class="sel-ok" style="margin-top:0;color:var(--amber)">⚠ ${eh(nome)} — não encontrado na lista</span>`;
};

/* ── Submeter ─────────────────────────────────────────── */
window.submeter = async function() {
  const msgEl = document.getElementById("form-msg");
  const tp    = processo.tipo;

  const mapRows = (arr, tipo) => arr
    .filter(i => i.indicado_nome?.trim())
    .map(i => {
      const obsPartes = [];
      if (i.manual)         obsPartes.push("Indicado não encontrado na lista de membros — entrada manual");
      if (indicante.manual) obsPartes.push("Indicante não encontrado na lista de membros — entrada manual");
      return {
        processo_id:         processo.id,
        indicante_pessoa_id: indicante.pessoa_id || null,
        indicante_nome:      indicante.nome,
        indicado_pessoa_id:  i.indicado_id || null,
        indicado_nome:       i.indicado_nome,
        tipo,
        congregacao:         indicante.congregacao || null,
        ip_dispositivo:      navigator.userAgent?.slice(0, 200) || null,
        observacao:          obsPartes.length ? obsPartes.join("; ") : null,
      };
    });

  let rows = [];
  if (tp === "ambos") {
    rows = [...mapRows(dItems, "diacono"), ...mapRows(pItems, "presbitero")];
  } else if (tp === "diaconos") {
    rows = mapRows(dItems, "diacono");
  } else {
    rows = mapRows(pItems, "presbitero");
  }

  if (!rows.length) {
    msgEl.textContent = "Informe ao menos um nome para indicar.";
    msgEl.className = "form-msg err"; return;
  }

  const vistos = new Set();
  for (const r of rows) {
    const key = `${r.indicado_pessoa_id}-${r.tipo}`;
    if (vistos.has(key)) { msgEl.textContent = `Indicação duplicada: ${r.indicado_nome}.`; msgEl.className = "form-msg err"; return; }
    vistos.add(key);
  }

  const btns = document.querySelectorAll(".btn-pri");
  btns.forEach(b => { b.disabled = true; b.textContent = "Enviando…"; });
  msgEl.textContent = "";

  try {
    await sbPost("eleicao_indicacoes", rows);
    renderSucesso(rows.length);
  } catch (e) {
    msgEl.textContent = "Erro ao enviar: " + e.message; msgEl.className = "form-msg err";
    btns.forEach(b => { b.disabled = false; b.textContent = "Enviar indicações"; });
  }
};

/* ── Estados finais ──────────────────────────────────── */
function renderSucesso(n) {
  app.innerHTML = `
    <div class="state-block ok">
      <div style="font-size:44px;margin-bottom:16px">✅</div>
      <h2>Indicações registradas</h2>
      <p><strong>${n} indicação${n > 1 ? "ões" : ""}</strong> registrada${n > 1 ? "s" : ""} com sucesso.<br>
      Obrigado por participar, <strong>${eh(indicante.nome)}</strong>.<br>
      O Conselho da IPPenha analisará as indicações recebidas.</p>
    </div>`;
}

function renderJaIndicou() {
  app.innerHTML = `
    <div class="state-block ok">
      <div style="font-size:44px;margin-bottom:16px">✅</div>
      <h2>Indicações já enviadas</h2>
      <p>
        <strong>${eh(indicante.nome)}</strong>, suas indicações para este processo já foram registradas anteriormente.<br><br>
        Caso acredite que isso seja um engano, entre em contato com a secretaria da Igreja Presbiteriana da Penha.
      </p>
    </div>`;
}

function renderErro(titulo, desc) {
  app.innerHTML = `
    <div class="state-block">
      <div style="font-size:36px;margin-bottom:14px;opacity:.5">⚠</div>
      <h2 style="font-family:var(--f-serif)">${eh(titulo)}</h2>
      <p>${eh(desc)}</p>
    </div>`;
}
</script>

<!DOCTYPE html>
<!-- v1.2.0 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aniversariantes — IPPenha</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f6f2;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;line-height:1.5}

    /* Header */
    .topbar{background:#fff;border-bottom:1px solid #d8e8de;padding:12px 24px;display:flex;align-items:center}

    .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}

    /* Page header */
    .page-hdr{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:22px;border-bottom:2px solid #d8e8de}
    .page-ic{width:46px;height:46px;background:#1d4d35;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .page-lbl{font-size:10.5px;color:#6a8870;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:3px}
    .page-ttl{font-size:24px;font-weight:700;color:#1a2e22;letter-spacing:-.02em}

    /* Month tabs */
    .month-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:22px}
    .mtab{background:#fff;border:1.5px solid #d8e8de;border-radius:8px;color:#6a8870;font-size:11.5px;font-weight:500;padding:6px 13px;cursor:pointer;font-family:inherit;transition:background .12s,color .12s,border-color .12s}
    .mtab:hover{background:#e8f2ec;border-color:#a8c8b0;color:#1d4d35}
    .mtab.on{background:#1d4d35;border-color:#1d4d35;color:#fff;font-weight:600}

    /* KPIs */
    .kpis{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
    .kpi{background:#fff;border:1.5px solid #d8e8de;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px}
    .kpi-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
    .kpi-lbl{font-size:10px;color:#6a8870;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
    .kpi-val{font-size:22px;font-weight:700;color:#1a2e22;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

    /* Table */
    .table-wrap{background:#fff;border:1.5px solid #d8e8de;border-radius:14px;overflow:hidden}
    .table-hdr{padding:13px 18px;border-bottom:1px solid #e8f0e8;display:flex;align-items:center;justify-content:space-between}
    .table-ttl{font-size:11px;font-weight:700;color:#6a8870;text-transform:uppercase;letter-spacing:.08em}
    .table-count{font-size:11px;color:#6a8870;background:#f0f7f2;border:1px solid #d0e8d8;border-radius:20px;padding:2px 11px;font-weight:600}
    /* Destaque — aniversariantes de hoje */
    .destaques-lbl{font-size:10.5px;font-weight:700;color:#8a6800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .destaques-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
    .dest-card{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:2px solid #f59e0b;border-radius:16px;padding:20px 18px;text-align:center;position:relative;overflow:hidden}
    .dest-card::before{content:"🎉";position:absolute;top:10px;right:12px;font-size:18px;opacity:.5}
    .dest-av{width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#92400e;margin:0 auto 10px}
    .dest-nome{font-size:14px;font-weight:700;color:#78350f;line-height:1.3;margin-bottom:4px}
    .dest-funcao{font-size:11px;color:#a87840;margin-bottom:8px}
    .dest-idade{display:inline-block;background:#f59e0b;color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:3px 12px;font-variant-numeric:tabular-nums}

    /* Tabela do mês */
    .section-lbl{font-size:10.5px;font-weight:700;color:#6a8870;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
    .table-ov{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead tr{background:#f5f8f5;border-bottom:2px solid #c8e0d0}
    th{text-align:left;padding:10px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6a8870;font-weight:700;white-space:nowrap}
    tbody tr{border-bottom:1px solid #eef5f0;transition:background .1s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:#f5faf6}
    td{padding:10px 13px;color:#4a5e50;vertical-align:middle;font-size:12.5px}

    .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:#e8f2ec;border:1.5px solid #c0dcc8;color:#1d4d35}
    .nome-cell{display:flex;align-items:center;gap:10px}
    .nome-txt{font-weight:600;color:#1a2e22;font-size:13px}
    .nome-sub{font-size:10.5px;color:#8aaa90;margin-top:1px}
    .dia-n{font-size:18px;font-weight:700;color:#1d4d35;font-variant-numeric:tabular-nums;line-height:1}
    .dia-s{font-size:10px;color:#8aaa90;margin-top:2px}

    #status{color:#8aaa90;font-size:13px;padding:60px 0;text-align:center}
    .empty{text-align:center;padding:52px 20px;color:#a0b8a8}
    .empty-ic{font-size:34px;margin-bottom:12px}
    .empty-txt{font-size:13px}
    .foot{text-align:center;color:#b0c8b8;font-size:11px;margin-top:40px}

    @media(max-width:600px){
      .page-ttl{font-size:20px}
      .kpi-val{font-size:18px}
    }
  </style>
</head>
<body>

  <div class="topbar">
    <img src="icons/logo-ippenha.svg" alt="IPPenha" style="height:57px;width:auto">
  </div>

  <div class="wrap">
    <div class="page-hdr">
      <div class="page-ic">🎂</div>
      <div>
        <div class="page-lbl">Membresia · IPPenha</div>
        <div class="page-ttl">Aniversariantes</div>
      </div>
    </div>

    <div class="month-bar" id="month-bar"></div>
    <div id="kpis-wrap" class="kpis"></div>
    <div id="content"><div id="status">Carregando...</div></div>
    <div class="foot">SIPEN — Sistema Integrado da IPPenha</div>
  </div>

  <script>
    const SUPA_URL = "https://erhwryfzpycahgsohhbh.supabase.co";
    const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyaHdyeWZ6cHljYWhnc29oaGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg2MTUsImV4cCI6MjA5MTg0NDYxNX0.T0hp90Bmufj6a3oUPq1vYcLiGx9YjyMaZiE38S0e3_8";

    const MESES     = ["","Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const MESES_ABR = ["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

    let _cache = null;
    let _mesSel = new Date().getMonth() + 1;

    function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function initials(n){ return (n||"?").split(" ").filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join(""); }
    function diaOf(d){ try{ return new Date(d+"T00:00:00").getDate(); }catch{ return 0; } }
    function idade(d){
      try{
        const n=new Date(d+"T00:00:00"),a=new Date();
        const anivEsteAno=new Date(a.getFullYear(),n.getMonth(),n.getDate());
        return a.getFullYear()-n.getFullYear()-(a<anivEsteAno?1:0);
      }catch{ return "?"; }
    }

    function buildMonthBar(){
      document.getElementById("month-bar").innerHTML=MESES_ABR.slice(1).map((m,i)=>{
        const mes=i+1;
        return `<button class="mtab${mes===_mesSel?" on":""}" onclick="setMes(${mes})">${m}</button>`;
      }).join("");
    }

    window.setMes=function(mes){
      _mesSel=mes;
      document.querySelectorAll(".mtab").forEach((b,i)=>b.classList.toggle("on",i+1===mes));
      renderMes();
    };

    function renderMes(){
      if(!_cache) return;
      const now=new Date(), hoje=now.getDate(), mesAtual=now.getMonth()+1;

      const aniv=_cache.filter(r=>{
        if(!r.data_nascimento) return false;
        try{ return new Date(r.data_nascimento+"T00:00:00").getMonth()+1===_mesSel; }catch{ return false; }
      }).sort((a,b)=>diaOf(a.data_nascimento)-diaOf(b.data_nascimento));

      const anivHoje = mesAtual===_mesSel ? aniv.filter(r=>diaOf(r.data_nascimento)===hoje).length : 0;
      const anivSem  = mesAtual===_mesSel ? aniv.filter(r=>{ const d=diaOf(r.data_nascimento); return d>=hoje&&d<=hoje+6; }).length : 0;

      document.getElementById("kpis-wrap").innerHTML=`
        <div class="kpi">
          <div class="kpi-ico" style="background:#e8f2ec;color:#1d4d35">🎂</div>
          <div><div class="kpi-lbl">Total em ${MESES[_mesSel]}</div><div class="kpi-val">${aniv.length}</div></div>
        </div>
        ${mesAtual===_mesSel?`
        <div class="kpi">
          <div class="kpi-ico" style="background:#fde8e8;color:#b83030">🎉</div>
          <div><div class="kpi-lbl">Hoje</div><div class="kpi-val">${anivHoje}</div></div>
        </div>
        <div class="kpi">
          <div class="kpi-ico" style="background:#fdf3d0;color:#8a6800">📅</div>
          <div><div class="kpi-lbl">Próx. 7 dias</div><div class="kpi-val">${anivSem}</div></div>
        </div>`:""}`;

      const content=document.getElementById("content");
      if(!aniv.length){
        content.innerHTML=`<div class="table-wrap"><div class="empty"><div class="empty-ic">🎂</div><div class="empty-txt">Nenhum aniversariante em ${MESES[_mesSel]}</div></div></div>`;
        return;
      }

      const isHojeMes = mesAtual===_mesSel;
      const anivHojeList  = isHojeMes ? aniv.filter(r=>diaOf(r.data_nascimento)===hoje) : [];
      const anivResto     = isHojeMes ? aniv.filter(r=>diaOf(r.data_nascimento)!==hoje) : aniv;

      // Cards de destaque (apenas quando é o mês atual e tem aniversariantes hoje)
      const destHtml = anivHojeList.length ? `
        <div class="destaques-lbl">🎂 Aniversariantes de hoje</div>
        <div class="destaques-grid">
          ${anivHojeList.map(r=>`
            <div class="dest-card">
              <div class="dest-av">${esc(initials(r.nome))}</div>
              <div class="dest-nome">${esc(r.nome||"—")}</div>
              <div class="dest-funcao">${esc(r.funcao||"Membro")}</div>
              <div class="dest-idade">${idade(r.data_nascimento)} anos</div>
            </div>`).join("")}
        </div>` : "";

      // Tabela com o restante do mês
      const rows=anivResto.map(r=>{
        const dia=diaOf(r.data_nascimento);
        return `<tr>
          <td style="padding-left:18px;text-align:center;min-width:48px">
            <div class="dia-n">${dia}</div>
            <div class="dia-s">${MESES_ABR[_mesSel]}</div>
          </td>
          <td>
            <div class="nome-cell">
              <div class="av">${esc(initials(r.nome))}</div>
              <div>
                <div class="nome-txt">${esc(r.nome||"—")}</div>
                <div class="nome-sub">${esc(r.funcao||"Membro")}</div>
              </div>
            </div>
          </td>
          <td style="color:#6a8870;font-variant-numeric:tabular-nums">${idade(r.data_nascimento)} anos</td>
        </tr>`;
      }).join("");

      const tabelaHtml = anivResto.length ? `
        <div class="section-lbl">Demais aniversariantes de ${MESES[_mesSel]}</div>
        <div class="table-wrap">
          <div class="table-hdr">
            <span class="table-ttl">${MESES[_mesSel]}</span>
            <span class="table-count">${anivResto.length} membro${anivResto.length!==1?"s":""}</span>
          </div>
          <div class="table-ov">
            <table>
              <thead><tr>
                <th style="width:56px;padding-left:18px">Dia</th>
                <th>Nome</th>
                <th>Idade</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>` : "";

      content.innerHTML = destHtml + tabelaHtml;
    }

    async function init(){
      buildMonthBar();
      try{
        const r=await fetch(`${SUPA_URL}/rest/v1/rpc/get_aniversariantes`,{
          method:"POST",
          headers:{apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`,"Content-Type":"application/json"},
          body:"{}"
        });
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        _cache=await r.json();
        renderMes();
      }catch(e){
        document.getElementById("content").innerHTML=`<div id="status">Não foi possível carregar os dados.<br><small style="color:#b0c8b8">${e.message}</small></div>`;
      }
    }

    init();
  </script>
</body>
</html>
